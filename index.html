const roundHasData=r=>r.matches.some(m=>m.result||(m.fiche&&((m.fiche.ev&&m.fiche.ev.length)||m.fiche.elapsed>0||m.fiche.refs&&(m.fiche.refs.r1||m.fiche.refs.r2||m.fiche.refs.r3))));
function pushArchive(label,teams,fixtures,rounds){
  const fx=fixtures||[];
  /* الفرق المسجّلة (بلاعبيها أو مدرّبيها) معلومة ثمينة — تُؤرشف حتى بلا نتائج */
  const meaningful=fx.some(f=>f.ga!=null||(f.fiche&&f.fiche.ev&&f.fiche.ev.length))
    ||(rounds||[]).some(roundHasData)
    ||(teams||[]).some(t=>(t.kids&&t.kids.length)||t.coach);
  if(!meaningful) return false;
  if(isCards()) label='🃏 '+cGame().name+' — '+label;
  S.archive.push({id:uid('a'),ts:nowISO(),label,
    teams:JSON.parse(JSON.stringify(teams||[])),
    fixtures:JSON.parse(JSON.stringify(fx)),
    rounds:JSON.parse(JSON.stringify(rounds||[]))});
  return true;
}

/* =============== أوضاع الفرق الثابتة (دوري / مجموعتان) =============== */
/* عضوية اللاعب وقفل «فريق واحد فقط» */
const kidTeam=id=>S.teams.find(t=>t.kids.includes(id))||null;
function kidTeamsPlayed(id){
  const set=new Set();
  S.fixtures.forEach(f=>{
    if(f.ga==null||f.gb==null) return;
    if((f.ra||team(f.a).kids).includes(id)) set.add(f.a);
    if((f.rb||team(f.b).kids).includes(id)) set.add(f.b);
  });
  return [...set];
}
/* teamId فارغ = إزالة من الفريق. ترجع false إذا مُنع النقل */
function assignKidToTeam(id,teamId){
  const cur=kidTeam(id);
  if((cur?cur.id:'')===(teamId||'')) return true;
  const played=kidTeamsPlayed(id);
  if(teamId&&played.length&&!played.includes(teamId)&&!S.settings.allowSwitch){
    alert('⛔ ممنوع: '+kid(id).name+' سجّل ولعب مباريات مع فريق «'+team(played[0]).name+'» — لا يجوز أن يلعب مع فريق آخر في نفس البطولة.');
    return false;
  }
  if(teamId&&played.length&&!played.includes(teamId)&&S.settings.allowSwitch){
    if(!confirm(kid(id).name+' لعب مع «'+team(played[0]).name+'» — نقله إلى فريق آخر؟ نتائجه السابقة تبقى مع فريقه القديم.')) return false;
  }
  if(!teamId&&played.length){
    if(!confirm(kid(id).name+' لعب مع «'+team(played[0]).name+'» — إزالته من الفريق؟ (نتائجه السابقة تبقى محسوبة'+(S.settings.allowSwitch?')':'، ولن يستطيع اللعب مع فريق آخر)'))) return false;
  }
  if(teamId&&isCards()){ const t=S.teams.find(x=>x.id===teamId);
    if(t&&t.kids.filter(x=>x!==id).length>=cSize()){ alert('⛔ فريق «'+t.name+'» مكتمل ('+cSize()+' لاعبين).'); return false; } }
  if(cur) cur.kids=cur.kids.filter(x=>x!==id);
  if(teamId){ const t=S.teams.find(x=>x.id===teamId); if(!t) return false; t.kids.push(id); }
  return true;
}
function addManualTeam(name,coach){
  const isG=S.settings.mode==='groups';
  if(S.teams.some(t=>t.name===name)){ alert('اسم الفريق مستعمل.'); return false; }
  S.tseq++;
  let g=null;
  if(isG){ /* الفريق الجديد يدخل أصغر مجموعة — فيبقى التوزيع متساوياً (الفارق ≤ 1 عند العدد الفردي) */
    const n=nGroups(); g=0;
    for(let i=1;i<n;i++) if(S.teams.filter(t=>t.group===i).length<S.teams.filter(t=>t.group===g).length) g=i;
  }
  S.teams.push({id:uid('t'),no:S.tseq,name,coach:(coach||'').trim(),group:g,kids:[],ts:nowISO()});
  save(); return true;
}
/* إعادة توزيع الفرق على المجموعات بالتساوي (بترتيب تسجيلها) — العدد الفردي = مجموعة فيها فريق زيادة */
function evenSplitGroups(){
  const n=nGroups();
  S.teams.forEach((t,i)=>t.group=i%n);
  save();
}
/* تصحيح مجموعة خارج النطاق (بعد تغيير عدد المجموعات مثلاً) */
function normalizeGroups(){
  const n=nGroups();
  S.teams.forEach(t=>{

function fxCountPreview(T,isG,st){
  if(T<2) return '';
  let n, koN;
  if(isG){
    const ng=Math.max(2,Math.min(8,Number(st.nGrp)||2));
    const sizes=Array.from({length:ng},(_,i)=>Math.floor(T/ng)+(i<T%ng?1:0));
    n=sizes.reduce((a,c)=>a+c*(c-1)/2,0);
    const qa=Number(st.qAdv)===3?3:2; let q=qa*ng;  /* المتأهلون من كل مجموعة (الإعدادات) */
    if(st.preRnd===false&&q>8) q=8;                 /* التمهيدي ملغى → أفضل 8 مباشرة */
    const pi=Math.max(0,q-8), qf=q>4?(q>8?4:q-4):0;
    koN=pi+qf+2+(st.thirdPlace!==false?2:1);        /* تمهيدي + ربع + نصفان + نهائي (+ثالث) */
  } else { n=T*(T-1)/2; koN=(T>=4)?(st.thirdPlace!==false?4:3):1; }
  const dur=Number(st.matchMin)||8, tot=n+koN;
  return `📊 المباريات المتوقعة: <b>${n}</b> ${isG?'بالمجموعات':'بالدوري'} + <b>${koN}</b> إقصائي = <b>${tot}</b> ≈ <b>${tot*dur}</b> دقيقة.`;
}
function drawTeams(){
  S.settings.teamReg=false;
  const st=S.settings, P=present(), ts=Number(st.teamSize)||4;
  const T=Math.floor(P.length/ts), isG=st.mode==='groups';
  if(T<2){ alert('الحاضرون لا يكفون لفريقين.'); return; }
  if(isG&&T<2*nGroups()){ alert('نظام الـ'+nGroups()+' مجموعات يحتاج '+(2*nGroups())+' فرق على الأقل — صغّر حجم الفريق أو سجّل أولاداً.'); return; }
  autoBackup('قبل قرعة الفرق',true);
  let ordered;
  if(st.balance!==false){
    const pots=[[],[],[]];
    shuffle(P).forEach(k=>pots[pot(k)].push(k));
    ordered=[].concat(pots[0],pots[1],pots[2]);
  } else ordered=shuffle(P);
  const buckets=Array.from({length:T},()=>[]);
  ordered.forEach((k,i)=>{ const row=Math.floor(i/T), pos=i%T; buckets[row%2===0?pos:T-1-pos].push(k.id); });
  S.teams=buckets.map((ks,i)=>({id:uid('t'),no:i+1,name:'فريق '+(i+1),group:isG?i%nGroups():null,kids:ks,ts:nowISO()}));
  S.tseq=T; S.fixtures=[]; S.fseq=0;
  if(isG){
    for(let g=0;g<nGroups();g++) roundRobin(S.teams.filter(t=>t.group===g).map(t=>t.id)).forEach(p=>pushFx('G',g,p[0],p[1]));
  } else roundRobin(S.teams.map(t=>t.id)).forEach(p=>pushFx('L',null,p[0],p[1]));
  save(); autoBackup('بعد قرعة الفرق');
  renderPlay(); renderHeader();
  document.querySelector('main').scrollTop=0;
}
/* تصنيف المتأهلين (أول اثنين أو ثلاثة من كل مجموعة بحسب qAdv): الأوائل مرتّبين ثم الثواني (ثم الثوالث) —
   يُعاد حسابه بثبات لأن نتائج المجموعات لا تتغير بعد بدء الإقصائي */
function qualSeeds(){
  const n=nGroups(), qa=qAdvN();
  const fxs=S.fixtures.filter(f=>f.stage==='G'&&f.ga!=null&&f.gb!=null);
  const per=[]; for(let g=0;g<n;g++) per.push(teamStand(f=>f.stage==='G'&&f.group===g,t=>t.group===g));
  /* v76: تصنيف المتأهلين — بحسب الترتيب العام (أسلوب دوري الأبطال): المتأهلون يُرتَّبون
     بجدول واحد بغضّ النظر عن مركزهم بمجموعتهم */
  if(S.settings.seedMode==='overall'){
    const ids=new Set(); per.forEach(o=>o.slice(0,qa).forEach(r=>ids.add(r.t.id)));
    return teamStand(f=>f.stage==='G').filter(r=>ids.has(r.t.id));
  }
  /* الافتراضي — بحسب مراكز المجموعات (أسلوب كأس العالم): الأوائل مرتّبين، ثم الثواني، ثم الثوالث */
  let out=[]; for(let r=0;r<qa;r++) out=out.concat(sortStand(per.map(o=>o[r]).filter(Boolean),fxs));
  return out;
}
function makeKnockout(){
  const st=S.settings, isG=st.mode==='groups';
  const base=S.fixtures.filter(f=>f.stage==='L'||f.stage==='G');
  if(base.some(f=>f.ga==null)){ alert('سجّل كل نتائج '+(isG?'المجموعات':'الدوري')+' أولاً.'); return; }
  if(S.fixtures.some(isKO)) return;
  if(isG){
    const n=nGroups(), qa=qAdvN();
    if(n===2&&qa===2){ /* التقاطع الكلاسيكي: أول أ × ثاني ب، أول ب × ثاني أ */
      const A=teamStand(f=>f.stage==='G'&&f.group===0,t=>t.group===0);
      const B=teamStand(f=>f.stage==='G'&&f.group===1,t=>t.group===1);
      pushFx('S',null,A[0].t.id,B[1].t.id);
      pushFx('S',null,B[0].t.id,A[1].t.id);
    } else {
      let s=qualSeeds();
      /* الدور التمهيدي ملغى: يتأهل مباشرة أفضل 8 مصنفين للدور التالي ويُستبعد الأدنى (v71) */
      if(S.settings.preRnd===false&&s.length>8) s=s.slice(0,8);
      const q=s.length, id=i=>s[i].t.id;
      if(q<=4){ /* 4 متأهلين → نصف نهائي مباشرة 1×4، 2×3 */
        pushFx('S',null,id(0),id(q-1)); pushFx('S',null,id(1),id(2));
      } else if(q===6){ /* أفضل أوّلَيْن يستريحان، ربع نهائي 3×6 و4×5 */
        pushFx('Q',null,id(2),id(5)); pushFx('Q',null,id(3),id(4));
      } else if(q===8){ /* ربع نهائي كامل 1×8، 4×5، 2×7، 3×6 */
        pushFx('Q',null,id(0),id(7)); pushFx('Q',null,id(3),id(4));
        pushFx('Q',null,id(1),id(6)); pushFx('Q',null,id(2),id(5));
      } else if(q>8&&q<=16){ /* 9-16 متأهلاً → دور تمهيدي: أصحاب أدنى تصنيف يتقاتلون
                               على مقاعد ربع النهائي، وأفضل (16−q) مصنفاً يستريحون. 16 = دور الـ16 كامل (v96) */
        for(let j=16-q;j<8;j++) pushFx(q===16?'E':'P',null,id(j),id(15-j));
      } else { alert('عدد المتأهلين ('+q+') غير مدعوم — تأكد من عدد الفرق بالمجموعات.'); return; }
    }
  } else {
    const o=teamStand(f=>f.stage==='L');
    if(o.length>=4){ pushFx('S',null,o[0].t.id,o[3].t.id); pushFx('S',null,o[1].t.id,o[2].t.id); }
    else pushFx('F',null,o[0].t.id,o[1].t.id);
  }
  save(); renderPlay();
}
/* ربع النهائي بعد الدور التمهيدي (9-12 متأهلاً): المقعد j لصاحب التصنيف j إن كان مستريحاً،
   وإلا لفائز مباراته التمهيدية (j × 15−j). أزواج الربع: 1×8، 4×5، 2×7، 3×6 (بالمقاعد) */
function makeQuarters(){
  const ps=S.fixtures.filter(f=>f.stage==='P'||f.stage==='E');
  if(!ps.length||ps.some(f=>!fxWinner(f))){ alert('احسم كل مباريات الدور التمهيدي أولاً'+(isTawle()?'.':' — عند التعادل اختر الفائز بركلات الترجيح.')); return; }
  if(S.fixtures.some(f=>f.stage==='Q')) return;
  const s=qualSeeds(), q=s.length, id=i=>s[i].t.id;
  const wOf=(i,j)=>{ const f=ps.find(f=>(f.a===id(i)&&f.b===id(j))||(f.a===id(j)&&f.b===id(i))); return f?fxWinner(f):null; };
  const slot=j=> j<16-q ? id(j) : wOf(j,15-j);
  [[0,7],[3,4],[1,6],[2,5]].forEach(p=>pushFx('Q',null,slot(p[0]),slot(p[1])));
  save(); renderPlay();
}
/* نصف النهائي بعد ربع النهائي (3 أو 4 مجموعات) */
function makeSemis(){
  const qs=S.fixtures.filter(f=>f.stage==='Q');
  if(!qs.length||qs.some(f=>!fxWinner(f))){ alert('احسم كل مباريات ربع النهائي أولاً — عند التعادل اختر الفائز بركلات الترجيح.'); return; }
  if(S.fixtures.some(f=>f.stage==='S')) return;
  const w=qs.map(fxWinner);
  if(qs.length>=4){ pushFx('S',null,w[0],w[1]); pushFx('S',null,w[2],w[3]); }
  else { const s=qualSeeds(); pushFx('S',null,s[0].t.id,w[1]); pushFx('S',null,s[1].t.id,w[0]); }
  save(); renderPlay();
}

function collectFiches(withArch,cntOnly){
  /* cntOnly: تجاهل مباريات الكأس التي لا تدخل بالترتيب (cnt:false) —
     يُستعمل لحساب مكافأة الأهداف وخصم البطاقات بالترتيب الفردي حصراً،
     فتبقى مباريات نصف النهائي/النهائي خارج النقاط والمكافآت معاً */
  const list=[];
  const push=m=>{ if(m&&m.fiche&&m.fiche.ev&&m.fiche.ev.length) list.push(m.fiche); };
  S.rounds.forEach(r=>r.matches.forEach(push));
  S.fixtures.forEach(fx=>{ if(cntOnly&&!fxCounts(fx)) return; push(fx); });
  if(cntOnly&&!withArch){
    /* v65: أهداف وبطاقات نصف النهائي المؤرشف تدخل بالمكافأة عندما يُحتسب الكأس */
    const arc=cupSemiArc();
    if(arc) (arc.fixtures||[]).forEach(fx=>{ if(fx.stage==='S') push(fx); });
  }
  if(withArch) (S.archive||[]).forEach(a=>{
    (a.rounds||[]).forEach(r=>(r.matches||[]).forEach(push));
    (a.fixtures||[]).forEach(push);
  });
  return list;
}
function showReports(withArch){
  withArch = withArch===true;   /* يُستدعى كمعالج نقر أحياناً */
  const g={}, y={}, r={};
  collectFiches(withArch).forEach(f=>{
    f.ev.forEach(e=>{ if(e.t==='g'&&e.kid) g[e.kid]=(g[e.kid]||0)+1; });
    const per=ficheCards(f);   /* 🟨×2 بنفس المباراة: الطرد التلقائي لا يُحصى طرداً */
    for(const k in per){ if(per[k].y) y[k]=(y[k]||0)+per[k].y; if(per[k].r) r[k]=(r[k]||0)+per[k].r; }
  });
  const rows=(o,unit)=>{
    const arr=Object.entries(o).sort((a,b)=>b[1]-a[1]);
    if(!arr.length) return '<div class="empty">لا شيء مسجّلاً بعد</div>';
    return `<table><tr><th class="n">#</th><th>اللاعب</th><th class="n">${unit}</th></tr>${
      arr.map(([id,c],i)=>`<tr class="${i===0?'rank1':''}"><td class="n">${i+1}</td>
        <td>${kid(id).no?kid(id).no+'. ':''}${esc(kid(id).name)}${ageTxt(id)}</td>
        <td class="n"><b>${c}</b></td></tr>`).join('')}</table>`;
  };
  /* أهداف الفرق (أوضاع الفرق): من النتائج المعتمدة */
  let teamSec='';
  if(S.settings.mode!=='individual'&&S.teams.length){
    const tg={};
    S.teams.forEach(t=>tg[t.id]={n:t.name,gf:0,ga:0,p:0});
    const addFx=fx=>{ if(fx.ga==null||!tg[fx.a]||!tg[fx.b]) return;
      tg[fx.a].gf+=fx.ga; tg[fx.a].ga+=fx.gb; tg[fx.a].p++;
      tg[fx.b].gf+=fx.gb; tg[fx.b].ga+=fx.ga; tg[fx.b].p++; };
    S.fixtures.forEach(addFx);
    if(withArch) (S.archive||[]).forEach(a=>(a.fixtures||[]).forEach(addFx));
    const arr=Object.values(tg).sort((a,b)=>b.gf-a.gf);
    teamSec=isVolley()?'':`<div class="card"><h3><span>⚽ أهداف الفرق</span></h3>
      <table><tr><th>الفريق</th><th class="n">لعب</th><th class="n">سجّل</th><th class="n">عليه</th><th class="n">الفارق</th></tr>
      ${arr.map((t,i)=>`<tr class="${i===0?'rank1':''}"><td><b>${esc(t.n)}</b>${i===0&&t.gf?' <span class="tag y">🥇 الأكثر تسجيلاً</span>':''}${(i===arr.length-1&&arr.length>1)?' <span class="tag r">الأقل تسجيلاً</span>':''}</td>
        <td class="n">${t.p}</td><td class="n"><b>${t.gf}</b></td><td class="n">${t.ga}</td>
        <td class="n" style="direction:ltr">${(t.gf-t.ga>0?'+':'')+(t.gf-t.ga)}</td></tr>`).join('')}</table></div>`;
  }
  sheet(`<h2>📊 تقارير البطولة</h2>
    <label class="mini" style="display:block;margin-bottom:8px">
      <input type="checkbox" id="repArch" ${withArch?'checked':''} style="width:auto;margin-left:6px">تضمين مباريات الأرشيف 📚</label>
    ${isVolley()?'':`<div class="card"><h3><span>⚽ الهدّافون</span></h3>${rows(g,'أهداف')}</div>`}
    <div class="card"><h3><span>🟨 الإنذارات</span></h3>${rows(y,'إنذارات')}</div>
    <div class="card"><h3><span>🟥 الطرد</span></h3>${rows(r,'طرد')}</div>
    ${teamSec}
    <div class="mini" style="margin:4px 0 8px">الأرقام تُحتسب من أحداث فيش المباريات — ما لم يُسجَّل بالفيش لا يظهر هنا.</div>
    <button class="btn ghost" onclick="closeSheet()">إغلاق</button>`);
  $('#repArch').onchange=e=>showReports(e.target.checked===true);
}

/* v74: نقاط المواجهات المباشرة بين المتعادلين بالنقاط — للعرض في جداول الترتيب.
   تُحسب فقط عندما كل المتعادلين لعبوا ضد بعضهم كلهم؛ غير ذلك «—» */
function h2hCol(rows,fxPred){
  const st=S.settings, fxs=S.fixtures.filter(f=>fxPred(f)&&f.ga!=null&&f.gb!=null);
  const out={}; rows.forEach(r=>out[r.t.id]='—');
  const byPts={};
  rows.forEach(r=>{ (byPts[r.Pts]=byPts[r.Pts]||[]).push(r); });
  for(const p in byPts){
    const cl=byPts[p]; if(cl.length<2) continue;
    const ids=new Set(cl.map(r=>r.t.id));
    const met=(x,y)=>fxs.some(f=>(f.a===x&&f.b===y)||(f.a===y&&f.b===x));
    let complete=true;
    outer: for(let i=0;i<cl.length;i++) for(let j=i+1;j<cl.length;j++)
      if(!met(cl[i].t.id,cl[j].t.id)){ complete=false; break outer; }
    if(!complete) continue;
    const m={}; cl.forEach(r=>m[r.t.id]={p:0,gd:0,gf:0});
    fxs.forEach(f=>{ if(!ids.has(f.a)||!ids.has(f.b)) return;
      m[f.a].gd+=f.ga-f.gb; m[f.b].gd+=f.gb-f.ga; m[f.a].gf+=f.ga; m[f.b].gf+=f.gb;
      if(isVolley()){ m[f.a].p+=vTblPts(f.ga,f.gb); m[f.b].p+=vTblPts(f.gb,f.ga); }
      else if(f.ga>f.gb){ m[f.a].p+=st.win; m[f.b].p+=st.loss; }
      else if(f.gb>f.ga){ m[f.b].p+=st.win; m[f.a].p+=st.loss; }
      else { m[f.a].p+=st.draw; m[f.b].p+=st.draw; } });
    /* التعادل الدائري: النقاط المتساوية بالمواجهات تُحسم بفارقها فأهدافها —
       الأهداف تُعرض لمن تعادل مع غيره نقاطاً وفارقاً معاً */
    cl.forEach(r=>{ const x=m[r.t.id];
      const dup=cl.some(r2=>r2!==r&&m[r2.t.id].p===x.p&&m[r2.t.id].gd===x.gd);
      out[r.t.id]=`<b>${x.p}</b> <span class="mini" style="direction:ltr;unicode-bidi:isolate">(${x.gd>0?'+':''}${x.gd}${dup?' · '+x.gf:''})</span>`; });
  }
  return out;
}
/* وصف معايير الفصل عند التعادل — يتبع إعداد المواجهة المباشرة (h2h) */
function tieTxt(){
  const m=S.settings.h2h;
  const TW=isTawle(), dl=TW?'فارق النقاط':'فارق الأشواط';
  if((isCards()||TW)&&isSwissTeam()&&swTieRule()==='h2h') return 'النقاط ثم المواجهة المباشرة — وإن لم يلتقيا على خط التأهل: مباراة فاصلة (ترتيب ما دون ذلك: مجموع نقاط الخصوم ثم '+dl+')';
  if(isCards()||(TW&&isSwissTeam())) return (isSwissTeam()?'النقاط ثم مجموع نقاط الخصوم (بوخهولز) ثم ':'النقاط ثم ')+dl+' ثم المواجهة المباشرة';
  const gd=TW?'فارق النقاط':'فارق الأهداف', sc=TW?'النقاط المسجّلة':'المسجَّل';
  return m==='before'?'النقاط ثم نتيجة المواجهة المباشرة ثم '+gd+' ثم '+sc
       :m==='off'   ?'النقاط ثم '+gd+' ثم '+sc
                    :'النقاط ثم '+gd+' ثم المواجهة المباشرة ثم '+sc;
}

function doPrint(html){
  const w=PAPER();

  let s=document.getElementById('pgStyle');
  if(!s){ s=document.createElement('style'); s.id='pgStyle'; document.head.appendChild(s); }
  const mrg=(w===80?3:2);
  /* صفحة واحدة متصلة مهما طال الفيش: نقيس ارتفاع المحتوى الفعلي بعرض الورقة
     ثم نجعل طول الصفحة = طول المحتوى بالضبط — فلا يقسم المتصفح صفحات ولا تقص الطابعة بالنص */
  const meas=document.createElement('div');
  meas.className=(w===80?'w80':'');
  meas.style.cssText="position:absolute;left:-9999px;top:0;display:block;width:"+(w-2*mrg)+"mm;font-family:'Segoe UI',Tahoma,Arial,sans-serif";

  hmm=Math.max(50,Math.min(2000,hmm));
  s.textContent='@media print{@page{size:'+w+'mm '+hmm+'mm;margin:'+mrg+'mm}}';
  setTimeout(()=>window.print(),60);
}

function onFieldIds(f,side,A,B){
  const T=side==='A'?A:B, key=side==='A'?'a':'b';
  let field=(f.lineup&&f.lineup[key]&&f.lineup[key].length)?f.lineup[key].slice():T.ids.slice();
  /* التبديلات تُطبَّق بترتيب تسجيلها الفعلي (seq) لا بترتيب الدقيقة —
     فعند تصفير الساعة لشوط ثانٍ تعود الدقائق صغيرة ويختلّ الترتيب الزمني الظاهري،
     بينما تسلسل الإدخال يبقى هو الحقيقة: من خرج وعاد يظهر على الأرض صح */
  f.ev.filter(e=>e.t==='s'&&(e.side?e.side===side:(e.kid&&T.ids.includes(e.kid))))
      .sort((a,b)=>(a.seq||0)-(b.seq||0))

    if(e.kid) field=field.filter(x=>x!==e.kid);
    if(e.kid2&&!field.includes(e.kid2)) field.push(e.kid2);

  const ex=expelledIds(f);
  return field.filter(x=>!ex.has(x));
}

    if(e.side==='A') a++; else if(e.side==='B') b++;

function expelledIds(f){
  const ids=new Set(), yc={};
  f.ev.forEach(e=>{
    if(e.t==='r'&&e.kid) ids.add(e.kid);
    if(e.t==='y'&&e.kid){ yc[e.kid]=(yc[e.kid]||0)+1; if(yc[e.kid]>=2) ids.add(e.kid); }
  });
  return ids;
}
function expulsionMin(f,kid_){
  const r=f.ev.find(e=>e.t==='r'&&e.kid===kid_);
  if(r) return r.min==null?0:r.min;
  const ys=f.ev.filter(e=>e.t==='y'&&e.kid===kid_);
  return ys.length>=2?(ys[1].min==null?0:ys[1].min):null;
}
function vacancies(f,T){
  const ex=[...expelledIds(f)].filter(id=>T.ids.includes(id));
  const replaced=new Set(f.ev.filter(e=>e.t==='s'&&e.rfor).map(e=>e.rfor));
  /* المطرود من دكة الاحتياط (لم يكن على الأرض) لا يُنقص الفريق ولا يُستبدل */
  const la=(f.lineup&&f.lineup.a)||[], lb=(f.lineup&&f.lineup.b)||[];
  const myLu=la.some(id=>T.ids.includes(id))?la:lb.some(id=>T.ids.includes(id))?lb:[];
  const entered=new Set(f.ev.filter(e=>e.t==='s'&&e.kid2).map(e=>e.kid2));
  return ex.filter(id=>!replaced.has(id))
           .filter(id=>myLu.length===0||myLu.includes(id)||entered.has(id));

  if(curMin!=null&&curMin>=em+rm) return {ok:true};
  const oppSide=side==='A'?'B':'A', oppIds=(side==='A'?B:A).ids;
  const oppGoal=f.ev.some(e=>e.t==='g'&&(e.side?e.side===oppSide:oppIds.includes(e.kid))&&(e.min==null?0:e.min)>=em);

        <button class="btn ghost sm" data-vto="A" ${s.to.A>=c.to?'disabled':''}>⏱ توقّف ${esc(A.n)} (${Math.max(0,c.to-s.to.A)})</button>
        <button class="btn ghost sm" data-vto="B" ${s.to.B>=c.to?'disabled':''}>⏱ توقّف ${esc(B.n)} (${Math.max(0,c.to-s.to.B)})</button>
      </div>
      ${toLeft>0?`<div style="text-align:center;margin-top:6px;font-weight:800;font-size:22px;color:var(--red)">⏱ توقّف ${esc((toSide==='A'?A:B).n)} — ${toLeft}s</div>`:''}
    </div>`}
    <div class="row2" style="margin-bottom:10px">
      <button class="btn ghost sm" id="vUndo" ${f.ev.length?'':'disabled'}>↩ تراجع عن آخر حدث</button>
      <button class="btn ghost sm" id="vClose">إغلاق</button>
    </div>

    <div class="card" style="margin-bottom:10px"><h3><span>🟨 بطاقة / 🔁 تبديل / 📝 ملاحظة</span></h3>
      <div class="mini" style="margin-bottom:4px">الفريق:</div>
      <div class="chips">
        <button data-ves="A" class="${eside==='A'?'on':''}">${esc(A.n)}</button>
        <button data-ves="B" class="${eside==='B'?'on':''}">${esc(B.n)}</button></div>
      <div class="mini" style="margin:6px 0 4px">بطاقة للاعب${vCfg().cardPt?' — تُعطي نقطة والإرسال للخصم':''}:</div>
      <div class="row2">
        <select id="vCk">${optOf(ordOf(eside).concat(benchOf(eside)))}</select>
        <div class="row2">
          <button class="btn ghost sm" id="vY">🟨 إنذار</button>
          <button class="btn ghost sm" id="vR">🟥 طرد</button></div>
      </div>
      <div class="mini" style="margin:8px 0 4px">تبديل (خروج ← دخول):</div>
      <div class="row2">
        <select id="vSo">${optOf(ordOf(eside))}</select>
        <select id="vSi">${optOf(benchOf(eside))}</select>
      </div>
      <button class="btn ghost sm" id="vSub" style="width:100%;margin-top:6px">🔁 نفّذ التبديل (يأخذ مكانه بترتيب الإرسال)</button>
      <div class="mini" style="margin:8px 0 4px">ملاحظة:</div>
      <div class="row2"><input id="vNt" placeholder="نص الملاحظة"><button class="btn ghost sm" id="vNb">📝 أضف</button></div>
    </div>

    <div class="card" style="margin-bottom:10px"><h3><span>ترتيب الإرسال (التشكيلة)</span></h3>
      <div class="mini">اضغط الأسماء <b>بترتيب الإرسال</b>. الترتيب المحفوظ يُستعمل بكل الأشواط${vCfg().rotReset?' ويرجع للأول بكل شوط':' ويكمل عبر الأشواط'}.</div>
      ${orderCard('A',A)}${orderCard('B',B)}
    </div>

    <div class="card" style="margin-bottom:10px"><h3><span>سجل المباراة (${f.ev.length})</span></h3>
      ${f.ev.length?`<div class="list">${f.ev.slice().sort((p,q)=>(q.seq||0)-(p.seq||0)).slice(0,40).map(e=>{
        const sd=e.side==='A'?A:e.side==='B'?B:null;
        const txt=e.t==='p'?`🏐 نقطة — ${esc(sd?sd.n:'')}`
          :e.t==='y'?`🟨 إنذار — ${esc(nm(e.kid))} (${esc(sd?sd.n:'')})`
          :e.t==='r'?`🟥 طرد — ${esc(nm(e.kid))} (${esc(sd?sd.n:'')})`
          :e.t==='s'?`🔁 تبديل — خروج ${esc(nm(e.kid))} ← دخول ${esc(nm(e.kid2))} (${esc(sd?sd.n:'')})`
          :e.t==='to'?`⏱ توقّف مستقطع — ${esc(sd?sd.n:'')}`
          :`📝 ${esc(e.txt||'')}`;
        const col=e.t==='n'?'var(--red)':e.side==='A'?'var(--blue)':'#0a6b3d';
        return `<div class="it" style="border-right:4px solid ${col};border-bottom:none;border-radius:8px;padding:7px;margin-bottom:3px">
          <div class="g" style="font-size:13.5px;color:${col};font-weight:600">${txt}</div></div>`;}).join('')}</div>`
        :'<div class="empty">لا أحداث بعد</div>'}
      ${hit.arch?'<div class="mini" style="margin-top:6px">📚 مباراة من الأرشيف — للاطلاع فقط.</div>':''}
    </div>`;

    $('#mask').classList.add('on');
    const dis=hit.arch;
    document.querySelectorAll('#sheet [data-vf]').forEach(b=>b.onclick=()=>{ if(dis) return; f.vFirst=b.dataset.vf; save(); render(); });
    document.querySelectorAll('#sheet [data-ves]').forEach(b=>b.onclick=()=>{ eside=b.dataset.ves; subOut=''; render(); });
    document.querySelectorAll('#sheet [data-vp]').forEach(b=>b.onclick=()=>{
      if(dis) return;
      if(!ordOf('A').length||!ordOf('B').length){ alert('حدّد ترتيب الإرسال للفريقين أولاً.'); return; }
      push({t:'p',side:b.dataset.vp});
    });
    document.querySelectorAll('#sheet [data-vto]').forEach(b=>b.onclick=()=>{
      if(dis) return; const sd=b.dataset.vto;
      push({t:'to',side:sd});
      toSide=sd; toLeft=vCfg().toSec; if(toTmr) clearInterval(toTmr);
      toTmr=setInterval(()=>{ toLeft--; if(toLeft<=0){ clearInterval(toTmr); toTmr=null; toLeft=0; beep(2); } render(); },1000);
      render();
    });
    document.querySelectorAll('#sheet [data-vo]').forEach(b=>b.onclick=()=>{
      if(dis) return;
      const [sd,id]=b.dataset.vo.split('|'), key=sd==='A'?'a':'b';
      const arr=f.vOrder[key]; const i=arr.indexOf(id);
      if(i>=0) arr.splice(i,1); else arr.push(id);
      save(); render();
    });
    document.querySelectorAll('#sheet [data-vup]').forEach(b=>b.onclick=()=>{
      if(dis) return;
      const [sd,id]=b.dataset.vup.split('|'), key=sd==='A'?'a':'b';
      const arr=f.vOrder[key], i=arr.indexOf(id);
      if(i>0){ arr[i]=arr[i-1]; arr[i-1]=id; save(); render(); }
    });
    if($('#vUndo')) $('#vUndo').onclick=()=>{ if(!dis) undo(); };
    if($('#vClose')) $('#vClose').onclick=()=>{ if(toTmr) clearInterval(toTmr); closeSheet(); };
    if($('#vY')) $('#vY').onclick=()=>{ const v=$('#vCk').value; if(!v){ alert('اختر اللاعب.'); return; } if(!dis) push({t:'y',side:eside,kid:v}); };
    if($('#vR')) $('#vR').onclick=()=>{ const v=$('#vCk').value; if(!v){ alert('اختر اللاعب.'); return; } if(!dis) push({t:'r',side:eside,kid:v}); };
    if($('#vSub')) $('#vSub').onclick=()=>{
      const o=$('#vSo').value, i2=$('#vSi').value;
      if(!o||!i2){ alert('اختر الخارج والداخل.'); return; }
      if(!dis) push({t:'s',side:eside,kid:o,kid2:i2});
    };
    if($('#vNb')) $('#vNb').onclick=()=>{ const t=$('#vNt').value.trim(); if(!t) return; if(!dis) push({t:'n',side:eside,txt:t}); };
  }
  render();
}

function openFiche(mid){
  if(isVolley()) return openFicheVolley(mid);
  if(isTawle()) return openFicheTawle(mid);
  const hit=findMatch(mid); if(!hit) return;
  const m=hit.m, f=ficheOf(m);
  if(!f.lineup) f.lineup={a:[],b:[]};
  /* مدرّبا الفريقين يتعبآن تلقائياً من بيانات الفريق */
  if(hit.kind==='fx'&&!hit.arch){
    let ch=false;
    if(!f.refs.ca&&team(m.a).coach){ f.refs.ca=team(m.a).coach; ch=true; }
    if(!f.refs.cb&&team(m.b).coach){ f.refs.cb=team(m.b).coach; ch=true; }
    if(ch) save();
  }
  let etype='g', eside='A', editIdx=null, penOpen=false; /* editIdx = رقم الحدث قيد التعديل */
  const isTeamMode=S.settings.mode!=='individual';
  const fmtClk=()=>{ const e=Math.floor(fElapsed(f)), mm=Math.floor(e/60), ss=e%60;
    return String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0'); };
  const evLine=e=>{
    const nm=id=>{const k=kid(id);return k.no+'. '+k.name;};
    const d='د'+fmtEvMin(e.min);
    if(e.t==='s') return e.kid
      ? `🔁 ${d} · خروج ${esc(nm(e.kid))} ← دخول ${esc(nm(e.kid2))}${e.txt?' — '+esc(e.txt):''}`
      : `🟥🔁 ${d} · دخول ${esc(nm(e.kid2))} ${esc(e.txt||'مكان المطرود')}`;
    if(e.t==='n') return `📝 ${d} · ${esc(e.txt||'')}`;
    return `${EVN[e.t].split(' ')[0]} ${d} · ${esc(nm(e.kid))}${e.txt?' — '+esc(e.txt):''}`;
  };
  /* لون الحدث في سجل المباراة: كل فريق بلون، والملاحظات بالأحمر */
  const evClr=(e,A,B)=>{
    if(e.t==='n') return {c:'var(--red)',bg:'var(--redL)'};
    let sd=e.side;
    if(sd!=='A'&&sd!=='B'){ /* أحداث قديمة بلا side — نستدل من انتماء اللاعب */
      const id=e.kid||e.kid2;
      if(id&&A.ids.includes(id)) sd='A';
      else if(id&&B.ids.includes(id)) sd='B';
    }
    if(sd==='A') return {c:'var(--blue)',bg:'var(--blueL)'};
    if(sd==='B') return {c:'#0a6b3d',bg:'var(--greenL)'};
    return {c:'inherit',bg:'transparent'};
  };
  function render(){
    const [A,B]=matchSides(hit), t2=fTally(f,A,B), ga=t2[0], gb=t2[1];
    const totMin=f.dur+(f.et||0);          /* الوقت الأصلي + الإضافي */
    const over=fElapsed(f)>=totMin*60;
    const tied=ga===gb;
    const ET=eside==='A'?A:B;
    const field=onFieldIds(f,eside,A,B);
    const exAll=expelledIds(f);
    /* عودة المبدَّل: عند إطفاء الخيار، من خرج بتبديل عادي لا يعود يدخل هذه المباراة */
    const subbedOut=S.settings.reentry===false
      ? new Set(f.ev.filter(e=>e.t==='s'&&e.kid).map(e=>e.kid))
      : new Set();
    const benchTeam=(isTeamMode
      ? ET.ids.filter(id=>!field.includes(id))
      : S.kids.filter(k=>k.present&&!A.ids.includes(k.id)&&!B.ids.includes(k.id)).map(k=>k.id)
    ).filter(id=>!exAll.has(id)&&!subbedOut.has(id));
    const vac=vacancies(f,ET), rm=Math.max(0,Number(S.settings.redMin)||0);
    const optOf=ids=>ids.length
      ? '<option value="" disabled selected>— اختر اللاعب —</option>'
        +ids.map(id=>`<option value="${id}">${kid(id).no}. ${esc(kid(id).name)}${ageTxt(id)}</option>`).join('')
      : '<option value="" disabled selected>— لا لاعبين — سجّل لاعبي الفريق أولاً —</option>';
    const luBtns=(side,T)=>{
      const key=side==='A'?'a':'b', lu=f.lineup[key]||[];
      return `<div class="mini" style="margin:6px 0 2px"><b>${esc(T.n)}</b> — ${lu.length?lu.length+' أساسيين':'لم تُحدَّد بعد (يُعتبر كل المسجّلين على الأرض)'}</div>
      <div class="chips">${T.ids.length?T.ids.map(id=>`<button data-lu="${side}|${id}" class="${lu.includes(id)?'on':''}">${kid(id).no}. ${esc(kid(id).name)}${ageTxt(id)}</button>`).join('')
        :'<span class="mini" style="color:var(--red)">لا لاعبين مسجّلين مع هذا الفريق — سجّلهم من تبويب اللاعبين مع اختيار الفريق</span>'}</div>`;
    };
    const phTxt=f.hbreak?'☕ استراحة':((f.et||0)>0&&fElapsed(f)>=f.dur*60)?'⏱ إضافي':((f.half||1)===1?'شوط ١':'شوط ٢');
    $('#sheet').innerHTML=`<h2>📋 فيش المباراة — ${matchLabel(hit)}</h2>
      <div id="fxBar">
        <span class="t">${esc(A.n)}</span>
        <b class="s"${over?' style="color:var(--red)"':''}>${gb} - ${ga}${f.pen?' 🥅':''}</b>
        <span class="t l">${esc(B.n)}</span>
        <b class="c" id="fClkB"${over?' style="color:var(--red);background:var(--redL)"':''}>${fmtClk()}</b>
        <span class="ph">${phTxt}</span>
      </div>
      <div class="fxgrid"><div id="fxSide">
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:17px;margin-bottom:2px">
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(A.n)}</span>
        <b style="direction:ltr;unicode-bidi:isolate;color:var(--green);flex:none">${gb} - ${ga}</b>
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(B.n)}</span></div>
      <div style="text-align:center;margin-bottom:10px">
        <div id="fClk" style="font-size:46px;font-weight:800;direction:ltr;color:${over?'var(--red)':'var(--green)'};letter-spacing:2px">${fmtClk()}</div>
        ${(()=>{ const half=f.half||1, atBreak=!!f.hbreak;
          const inET=(f.et||0)>0&&fElapsed(f)>=f.dur*60;
          return `<div class="mini" style="font-weight:700">${atBreak?'☕ استراحة بين الشوطين'
            :inET?'⏱ الوقت الإضافي':('الشوط '+(half===1?'الأول':'الثاني'))}</div>`; })()}
        ${f.pen?`<div class="mini" style="font-weight:700">🥅 ركلات الترجيح: <b style="direction:ltr;unicode-bidi:isolate">${f.pen.b} - ${f.pen.a}</b></div>`:''}
        <div class="mini">مدة المباراة كاملة (الشوطان معاً)
          <input id="fDur" type="number" min="1" max="120" value="${f.dur}" style="width:60px;display:inline-block;padding:4px;text-align:center"> دقيقة
          ${f.et?`· <b>+ إضافي ${f.et} د</b>`:''}
          ${f.kick?`· البداية <b>${String(new Date(f.kick).getHours()).padStart(2,'0')}:${String(new Date(f.kick).getMinutes()).padStart(2,'0')}</b>`:''}
          ${over?'· <b style="color:var(--red)">⏱ انتهى الوقت</b>':''}</div>
        <div class="row3" style="margin-top:8px">
          <button class="btn ${f.running?'gold':'main'} sm" id="fGo">${f.running?'⏸ إيقاف':(fElapsed(f)>0?'▶ متابعة':'▶ بدء')}</button>
          <button class="btn ghost sm" id="fRst">↺ تصفير</button>
          <button class="btn ghost sm" id="fPrn">🖨 الفيش</button>
        </div>
        ${(()=>{ /* نظام الشوطين: استراحة ثم متابعة — الدقائق تتابع العدّ كمباراة حقيقية */
          if(hit.arch) return '';
          const half=f.half||1, atBreak=!!f.hbreak, halfSec=f.dur*60/2;
          if(half===1) return `<button class="btn ghost sm" id="fHalf" style="width:100%;margin-top:6px${(fElapsed(f)>=halfSec&&!over)?';border-color:var(--gold);color:#6B5210;font-weight:700':''}">🏁 إنهاء الشوط الأول — استراحة${fElapsed(f)>=halfSec?' (حان وقتها)':''}</button>`;
          if(atBreak) return `<button class="btn main sm" id="fHalf2" style="width:100%;margin-top:6px">▶ بدء الشوط الثاني</button>`;
          return `<div class="mini" style="margin-top:4px">الشوط الثاني جارٍ — الدقائق تتابع العدّ من حيث انتهى الأول</div>`;
        })()}
        ${(()=>{ /* انتهى الوقت والنتيجة تعادل: إنهاء تعادلاً / وقت إضافي / ركلات ترجيح */
          if(hit.arch||!over||!tied||f.pen) return '';
          const resultSaved=hit.kind==='fx'?m.ga!=null:!!m.result;
          if(resultSaved) return '';
          const drawOK=hit.kind==='fx'?(m.stage==='L'||m.stage==='G'):true;
          return `<div class="warnbox" style="margin-top:8px;text-align:right">
            ⚖️ <b>انتهى الوقت والنتيجة تعادل (<b style="direction:ltr;unicode-bidi:isolate">${gb} - ${ga}</b>)</b> — قرروا:
            <div class="row3" style="margin-top:6px">
              ${drawOK?'<button class="btn ghost sm" id="fEndDraw">✔ إنهاء تعادلاً</button>'
                :'<button class="btn ghost sm" disabled>لا تعادل هنا</button>'}
              <button class="btn ghost sm" id="fEt">⏱ وقت إضافي</button>
              <button class="btn gold sm" id="fPenBtn">🥅 ركلات ترجيح</button>
            </div>
            ${drawOK?'':'<div class="mini" style="margin-top:4px">مباراة إقصائية — لا بد من فائز: وقت إضافي ثم ركلات ترجيح.</div>'}
            ${penOpen?`<div class="row2" style="margin-top:6px">
              <div class="fld"><label>ركلات ${esc(A.n)}</label><input id="fPa" type="number" min="0" inputmode="numeric"></div>
              <div class="fld"><label>ركلات ${esc(B.n)}</label><input id="fPb" type="number" min="0" inputmode="numeric"></div></div>
              <div class="mini">سجّلوا المجموع النهائي بعد حسم الركلات (لا يجوز التساوي)</div>
              <button class="btn main sm" id="fPenSave" style="width:100%;margin-top:4px">حفظ الركلات واعتماد النتيجة</button>`:''}
          </div>`; })()}
      </div>
      </div><div id="fxMain">
      <div class="card" style="margin-bottom:10px"><h3><span>${editIdx!=null?'✎ تعديل حدث':'تسجيل حدث'}</span></h3>
        ${editIdx!=null?`<div class="warnbox" style="margin:0 0 6px;background:var(--goldL);border-color:var(--gold)">✎ تعديل الحدث:
          «${evLine(f.ev[editIdx]||{})}» — عدّل ما تريد ثم اضغط «حفظ التعديل».
          <button class="btn ghost sm" id="fEdX" style="width:auto;display:inline-block;padding:3px 12px;margin-inline-start:6px">إلغاء</button></div>`:''}
        <div class="mini" style="margin-bottom:4px">١) اختر الفريق:</div>
        <div class="chips">
          <button data-es="A" class="${eside==='A'?'on':''}">${esc(A.n)}</button>
          <button data-es="B" class="${eside==='B'?'on':''}">${esc(B.n)}</button>
        </div>
        <div class="mini" style="margin-bottom:4px">٢) نوع الحدث:</div>
        <div class="chips">${Object.keys(EVN).map(t=>`<button data-et="${t}" class="${etype===t?'on':''}">${EVN[t]}</button>`).join('')}</div>
        ${(()=>{ /* لا اختيار لاعب قبل تسجيل تشكيلة البداية لفريقه (التعديل مستثنى) */
          const needLU=isTeamMode&&etype!=='n'&&editIdx==null&&!((f.lineup[eside==='A'?'a':'b']||[]).length);
          if(needLU) return `<div class="warnbox" style="margin:6px 0">⚠️ سجّل <b>تشكيلة البداية</b> لفريق «${esc(ET.n)}» أولاً
            (من بطاقة «تشكيلة البداية» في الأسفل) — قبلها لا يمكن اختيار لاعب لتسجيل حدث.</div>`;
          const vacNote=vac.length?`<div class="warnbox" style="margin:6px 0">🟥 ${esc(ET.n)} يلعب ناقصاً — مطرود: ${vac.map(id=>esc(kid(id).name)).join('، ')}.
            إدخال بديل مكانه عبر «🔁 تبديل» يُسمح بعد <b>${rm}</b> دقائق من الطرد أو بعد هدف للخصم.</div>`:'';
          /* البطاقات تُشهر بوجه أي لاعب مسجّل (حتى من الاحتياط) — لا تقتصر على من في الملعب */
          const cardPool=[...new Set([...ET.ids,...field,...benchTeam])].filter(id=>!exAll.has(id));
          /* في وضع التعديل: كل اللوائح مفتوحة على جميع لاعبي الفريق لتصحيح أي خطأ إدخال */
          const ee=editIdx!=null?f.ev[editIdx]:null;
          const allP=[...new Set([...ET.ids,...field,...benchTeam,...(ee?[ee.kid,ee.kid2].filter(Boolean):[])])];
          const outOpts=(ee&&ee.rfor?`<option value="__red|${ee.rfor}">🟥 مكان المطرود: ${kid(ee.rfor).no}. ${esc(kid(ee.rfor).name)}</option>`:'')
            +vac.filter(id=>!(ee&&ee.rfor===id)).map(id=>`<option value="__red|${id}">🟥 مكان المطرود: ${kid(id).no}. ${esc(kid(id).name)}</option>`).join('')
            +optOf(editIdx!=null?allP:field);
          return `${vacNote}${etype==='n'?'':`<div class="mini" style="margin-bottom:4px">٣) اللاعب (من ${esc(ET.n)}):</div>`}
          ${etype==='s'?`<div class="row2">
              <div class="fld"><label>خروج (من الملعب)</label><select id="fk1">${outOpts}</select></div>
              <div class="fld"><label>دخول (من الاحتياط)</label><select id="fk2">${optOf(editIdx!=null?allP:benchTeam)}</select></div>
            </div>`
          : etype==='n'?''

function printFiche(hit){
  const m=hit.m, f=ficheOf(m), sides2=matchSides(hit), A=sides2[0], B=sides2[1];
  const t=fTally(f,A,B);
  const nm=id=>{const k=kid(id);return '<i>'+k.no+'</i> '+esc(k.name)+(kidAgeById(id)!=null?' <i>('+kidAgeById(id)+')</i>':'');};
  const luOf=key=>((f.lineup&&f.lineup[key]&&f.lineup[key].length)?f.lineup[key]:null);
  const luA=luOf('a'), luB=luOf('b');
  const benchA=luA?A.ids.filter(id=>!luA.includes(id)):[];
  const benchB=luB?B.ids.filter(id=>!luB.includes(id)):[];
  const startA=luA||A.ids, startB=luB||B.ids;
  const evTxt=e=>{
    const d='د'+fmtEvMin(e.min);
    const sd=e.side?(' ('+esc((e.side==='A'?A:B).n)+')'):'';
    if(e.t==='s') return e.kid

    if(e.t==='n') return '📝 '+d+' '+esc(e.txt||'');

  doPrint(`<div class="pr">${head('فيش المباراة')}
    <div class="ttl" style="font-size:13px">${esc(A.n)} ضد ${esc(B.n)}</div>
    <div class="ft">${matchLabel(hit)} · ${fmtDT(nowISO())} · مدة ${f.dur} د${f.et?' + إضافي '+f.et+' د':''}${f.kick?' · البداية '+String(new Date(f.kick).getHours()).padStart(2,'0')+':'+String(new Date(f.kick).getMinutes()).padStart(2,'0'):''}</div><hr>
    <div style="font-size:16px;font-weight:800">النتيجة: ${esc(A.n)} <i>${t[0]}</i> — ${esc(B.n)} <i>${t[1]}</i></div><hr>
    <div style="text-align:right;font-weight:800">تشكيلة البداية</div>
    <table><tr><td style="width:50%"><b>${esc(A.n)}</b>${f.refs.ca?'<br>مدرّب: '+esc(f.refs.ca):''}</td>
      <td><b>${esc(B.n)}</b>${f.refs.cb?'<br>مدرّب: '+esc(f.refs.cb):''}</td></tr>
    ${Array.from({length:Math.max(startA.length,startB.length)},(_,i)=>
      `<tr><td>${startA[i]!==undefined?nm(startA[i]):''}</td><td>${startB[i]!==undefined?nm(startB[i]):''}</td></tr>`).join('')}
    </table>
    ${(benchA.length||benchB.length)?`<div style="text-align:right;font-weight:800;margin-top:4px">الاحتياط</div>
    <table>${Array.from({length:Math.max(benchA.length,benchB.length)},(_,i)=>
      `<tr><td style="width:50%">${benchA[i]!==undefined?nm(benchA[i]):''}</td><td>${benchB[i]!==undefined?nm(benchB[i]):''}</td></tr>`).join('')}</table>`:''}
    <hr>
    ${f.ev.length?`<div style="text-align:right;font-weight:800">أحداث المباراة</div>
    <div style="text-align:right">${f.ev.map(e=>'<div>'+evTxt(e)+'</div>').join('')}</div><hr>`:''}
    <div style="text-align:right;font-weight:800">التواقيع</div>
    ${(()=>{ /* كل معنيّ: دوره واسمه وتحته مساحة فارغة للتوقيع اليدوي */
      const sg=(role,name)=>`<td style="width:50%;vertical-align:top;padding:2px 3px">
        <div class="sig">${role}${name?'<br>'+esc(name):'<br>__________'}</div>
        <div class="sigbox"></div></td>`;
      return `<table>
        <tr>${sg('مدرّب '+esc(A.n),f.refs.ca)}${sg('مدرّب '+esc(B.n),f.refs.cb)}</tr>
        <tr>${sg('الحكم الأول',f.refs.r1)}${sg('الحكم الثاني',f.refs.r2)}</tr>
        <tr><td colspan="2" style="vertical-align:top;padding:2px 3px">
          <div class="sig">حكم الوقت والسجل${f.refs.r3?'<br>'+esc(f.refs.r3):'<br>__________'}</div>
          <div class="sigbox"></div></td></tr>
      </table>`; })()}
    ${cutBlock()}</div>`);
}

  /* إظهار/إخفاء فوري بحسب الرياضة والنظام المختارين (قبل الحفظ) */
  const setVis=()=>{
    const sp=$('#s_sport').value, md=$('#s_mode').value;
    if(sp==='tawle'&&md==='individual'){ $('#s_mode').value='groups'; return setVis(); }
    const c={fb:sp==='football',vb:sp==='volley',cd:sp==='cards',tw:sp==='tawle',cdt:sp==='cards'||sp==='tawle',nofb:sp!=='football',

      if(navigator.serviceWorker){
        const regs=await navigator.serviceWorker.getRegistrations();
        for(const r of regs){ try{ await r.unregister(); }catch(e){} }
      }
      if(window.caches){ const ks=await caches.keys(); for(const k of ks){ try{ await caches.delete(k); }catch(e){} } }

      let data=null;

      if(o&&o.type==='hsarat_full'&&Array.isArray(o.tours)&&o.tours.length){
        if(!confirm('ملف نسخة شاملة يحوي '+o.tours.length+' بطولة:\n'+o.tours.map(t=>'• '+t.name).join('\n')+'\nسيستبدل بيانات هذه البطولات، وما ليس في الملف يبقى كما هو. متابعة؟')) return;
