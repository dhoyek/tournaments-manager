<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B3D2E">
<title>مباريات حصارات للناشئين</title>
<style>
:root{--green:#0B3D2E;--greenL:#E8F0EB;--gold:#C9A24A;--goldL:#FBF3DF;--bg:#F4F6F5;
--line:#DCE3DF;--mut:#6B7A72;--red:#B3001B;--redL:#FDECEF;--blue:#1B4F72;--blueL:#E7EFF6}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:#12211B;
display:flex;flex-direction:column;overflow:hidden}
button,input,select{font-family:inherit;font-size:16px;border:none;background:none;color:inherit;cursor:pointer}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;cursor:auto}
input:focus,select:focus{border-color:var(--green)}
header{background:var(--green);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px;flex:none}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:15px;line-height:1.25}
header .t small{font-size:11.5px;opacity:.85}
#gbar .chips{margin:0;gap:6px}#gbar .chips button{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}#gbar .chips button.on{background:#fff;color:var(--green);border-color:#fff}#gbar select{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:8px 10px;font-weight:700;width:100%}
.match.rdy{border:2.5px solid #1F8A4C;box-shadow:0 0 0 4px rgba(31,138,76,.18);animation:rdyp 1.6s ease-in-out infinite}
.match.rdy .mh{background:#1F8A4C;color:#fff}
.match.rdy .mh .iconbtn{background:#fff;color:#14532D;border-color:#fff}
@keyframes rdyp{0%,100%{box-shadow:0 0 0 3px rgba(31,138,76,.15)}50%{box-shadow:0 0 0 7px rgba(31,138,76,.30)}}
.rdybar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#E7F5EC;color:#14532D;font-weight:700;font-size:13px;border-bottom:1px solid #BFE3CC}
.rdybar button{margin-inline-start:auto}
#swToast{position:fixed;top:8px;left:8px;right:8px;z-index:60;background:#14532D;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14px;display:none}
#swToast b{color:#FFE08A}
header .pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 10px;font-size:12px;white-space:nowrap}
.lockp{cursor:pointer}
.lockp.open{background:#8A6D1F;border-color:var(--gold)}
.pinbox{display:flex;gap:10px;justify-content:center;margin:10px 0 14px}
.pinbox i{width:16px;height:16px;border-radius:50%;border:2px solid var(--green);display:block}
.pinbox i.f{background:var(--green)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{padding:15px 0;border-radius:12px;background:var(--greenL);color:var(--green);font-size:22px;font-weight:800;direction:ltr}
.pad button.alt{background:var(--bg);color:var(--mut);font-size:15px}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);flex:none}
nav button{flex:1;padding:11px 2px;font-size:13.5px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--green);border-bottom-color:var(--green);background:var(--greenL)}
nav button .dot{display:inline-block;min-width:17px;height:17px;line-height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;margin-right:3px;padding:0 4px}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.tab{display:none}.tab.on{display:block}
.wrap{padding:12px;max-width:900px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h3{font-size:15px;color:var(--green);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;justify-content:space-between}
.btn{padding:13px;border-radius:12px;font-weight:800;font-size:16px;text-align:center;display:block;width:100%}
.btn.main{background:var(--green);color:#fff}
.btn.main:disabled{background:#9DB3A9}
.btn.ghost{background:var(--bg);border:1.5px solid var(--line);color:var(--mut);font-size:14px;padding:11px}
.btn.gold{background:var(--gold);color:#3A2E0B}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px;font-weight:600}
.mini{font-size:12.5px;color:var(--mut);line-height:1.65}
.empty{padding:26px 16px;text-align:center;color:var(--mut);font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mut);font-size:12px;font-weight:700;background:var(--greenL)}
td.n,th.n{text-align:center}
.tag{display:inline-block;background:var(--greenL);color:var(--green);border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:700}
.tag.r{background:var(--redL);color:var(--red)}
.tag.y{background:var(--goldL);color:#6B5210}
.tag.b{background:var(--blueL);color:var(--blue)}
.tag.g{background:#DDF2E3;color:#0B6B32}
.list .it{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:none}
.list .it .g{flex:1;min-width:0}
.list .it b{font-size:14.5px}
.list .it small{display:block;color:var(--mut);font-size:11.5px}
.iconbtn{width:34px;height:34px;border-radius:9px;background:var(--bg);border:1px solid var(--line);font-size:15px;flex:none}
.iconbtn.d{color:var(--red);border-color:#F3B7BF;background:var(--redL)}
.iconbtn:disabled{opacity:.25}
.okbox{background:var(--goldL);border:1px solid #E8D08A;color:#6B5210;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;line-height:1.6}
.warnbox{background:var(--redL);border:1px solid #F3B7BF;color:#7A0016;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;line-height:1.6}
.infobox{background:var(--blueL);border:1px solid #BBD3E8;color:#123A55;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;line-height:1.6}
.match{border:1.5px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;background:#fff}
.match .mh{background:var(--greenL);padding:7px 12px;font-size:13px;font-weight:800;color:var(--green);display:flex;justify-content:space-between;align-items:center}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
.team{padding:10px}
.team.b{background:#FAFCFB}
.team .tn{font-size:13px;font-weight:800;margin-bottom:6px;text-align:center}
.team ul{list-style:none}
.team li{font-size:13.5px;padding:3px 0;display:flex;gap:5px;align-items:center}
.team li .num{background:var(--bg);border-radius:5px;padding:0 5px;font-size:11px;font-weight:700;direction:ltr;color:var(--mut)}
.vs{display:flex;align-items:center;justify-content:center;padding:0 6px;color:var(--mut);font-weight:800;font-size:12px;border-right:1px dashed var(--line);border-left:1px dashed var(--line)}
.res{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px;border-top:1px solid var(--line)}
.res button{padding:11px 4px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);font-weight:800;font-size:13.5px;color:var(--mut)}
.res button.on{background:var(--green);color:#fff;border-color:var(--green)}
.res button.on.d{background:var(--gold);color:#3A2E0B;border-color:var(--gold)}
.rank1{background:#FFF8E1}.rank2{background:#F4F4F4}.rank3{background:#FBF0E4}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.mask.on{display:flex}
.sheet{background:#fff;width:100%;max-width:540px;border-radius:18px 18px 0 0;padding:14px;max-height:92vh;overflow:auto}
/* فيش المباراة: الوقت والنتيجة وأسماء الفريقين ظاهرون دائماً مهما نزلنا */
#fxBar{position:sticky;top:-14px;z-index:8;background:#fff;border:1.5px solid var(--green);border-radius:12px;
  padding:7px 10px;margin:0 0 10px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 10px rgba(11,61,46,.14)}
#fxBar .t{flex:1;font-weight:800;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fxBar .t.l{text-align:left}
#fxBar .s{font-size:20px;font-weight:800;direction:ltr;unicode-bidi:isolate;color:var(--green);flex:none}
#fxBar .c{font-size:17px;font-weight:800;direction:ltr;color:var(--green);background:var(--greenL);
  border-radius:8px;padding:2px 8px;flex:none;letter-spacing:1px}
#fxBar .ph{font-size:10.5px;color:var(--mut);flex:none;text-align:center;line-height:1.2}
/* شاشة عريضة: عمودان — الوقت والنتيجة ثابتان بجهة، والأحداث والفيش بالجهة الثانية */
@media(min-width:760px){
  .sheet.wide{max-width:980px}
  .sheet.wide .fxgrid{display:grid;grid-template-columns:310px minmax(0,1fr);gap:14px;align-items:start}
  .sheet.wide #fxSide{position:sticky;top:44px}
}
.sheet h2{font-size:17px;color:var(--green);margin-bottom:12px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--bg);color:var(--mut);border:1.5px solid var(--line)}
.chips button.on{background:var(--green);color:#fff;border-color:var(--green)}
#printArea{display:none}
/* أنماط الفيش الورقي خارج media print كي يمكن قياس ارتفاع المحتوى قبل الطباعة
   (تظهر فقط داخل #printArea المخفي أو حاوية القياس خارج الشاشة) */
.pr{width:100%;text-align:center;color:#000;font-size:12px;line-height:1.45}
.pr .club{font-size:13px;font-weight:700}
.pr .ev{font-size:11px}
.pr hr{border:none;border-top:1px dashed #000;margin:5px 0}
.pr .ttl{font-size:15px;font-weight:800;padding:4px 0;border:2px solid #000;margin:5px 0}
.pr table{width:100%;font-size:11px;border-collapse:collapse}
.pr table td,.pr table th{border:none;padding:2px 0;text-align:right}
.pr table td.n,.pr table th.n{text-align:center}
.pr i{font-style:normal;display:inline-block;direction:ltr;unicode-bidi:isolate}
.pr .ft{font-size:10px;margin-top:4px}
.pr .cut{font-size:11px;margin-top:6px;letter-spacing:1px}
.pr .feed{font-size:12px;line-height:1.6}
.pr .sig{font-weight:700;font-size:11px;text-align:right}
.pr .sigbox{height:13mm;border:1px dashed #000;border-radius:2mm;margin-top:1mm}
.w80 .pr{font-size:14px}
.w80 .pr table{font-size:13px}
.w80 .pr .ttl{font-size:19px}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  body>*{display:none !important}
  #printArea{display:block !important;width:100%;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
  @page{size:58mm auto;margin:2mm}
}
@media (min-width:820px){ .wrap{padding:16px} }
</style>
</head>
<body>
<header>
  <div class="t"><b id="hClub">مباريات حصارات للناشئين</b><small id="hEv"></small></div>
  <button class="pill" id="hTour" title="إدارة البطولات">🏆</button>
  <span class="pill" id="hPresent">—</span>
  <button class="pill lockp" id="hLock" style="display:none">🔒</button>
</header>
<div id="gbar" style="display:none;background:var(--green);padding:0 10px 8px"></div>
<nav>
  <button data-t="play" class="on">الجولة</button>
  <button data-t="kids">الأولاد <span class="dot" id="dKids">0</span></button>
  <button data-t="rank">الترتيب</button>
  <button data-t="set">الإعدادات</button>
</nav>
<main>
  <div class="tab on" id="play"><div class="wrap" id="playWrap"></div></div>
  <div class="tab" id="kids"><div class="wrap" id="kidsWrap"></div></div>
  <div class="tab" id="rank"><div class="wrap" id="rankWrap"></div></div>
  <div class="tab" id="set"><div class="wrap" id="setWrap"></div></div>
</main>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div id="printArea"></div>
<link rel="manifest" href="manifest.json">

<script>
const APPV='97';
/* ---------- بطولات متعددة: كل بطولة نظام مستقل تحت مفتاح تخزين خاص ---------- */
const TREG='hsarat_tournaments_v1';
let KEY='hsarat_kids_v1', BKEY=KEY+'_bak', AKEY=KEY+'_auto';
let S=null, STORAGE_OK=true;
function tregLoad(){ try{ const r=JSON.parse(localStorage.getItem(TREG)); if(r&&r.list&&r.list.length) return r; }catch(e){} return null; }
function tregSave(r){ try{ localStorage.setItem(TREG,JSON.stringify(r)); }catch(e){} }
/* v88: الإعداد الجاهز لبطولة الورق — جهاز جديد يفتح عليه مباشرةً، ويمكن إنشاؤه من 🏆 */
const CARDS_NAME='بطولة الورق 2026';
function cardsPreset(){
  const st=DEFAULTS();
  Object.assign(st.settings,{event:CARDS_NAME,plabel:'اللاعبون',sport:'cards',
    cGames:[{id:'g400',name:'400',n:1},{id:'glikha',name:'ليخا',n:1}],cTeamSize:2,
    mode:'swiss',swUnit:'team',swFlow:'cont',swTarget:5,swAuto:true,swQual:4,swTie:'h2h',swRepair:true,swRepairMin:0,teamReg:true,fxDirect:true,
    win:3,draw:0,loss:0,minMatches:0,thirdPlace:true,fxNames:true});
  st.cGame='g400'; st.cGamesV=2; st.gfx={}; st.swBye=[];
  return st;
}
/* v96: الإعداد الجاهز لبطولة الطاولة — مجموعات ثم إقصائي، مختلطة (فرنجية/محبوسة بالتناوب) */
const TAWLE_NAME='بطولة الطاولة 2026';
function tawlePreset(){
  const st=DEFAULTS();
  Object.assign(st.settings,{event:TAWLE_NAME,plabel:'اللاعبون',sport:'tawle',
    mode:'groups',nGrp:4,qAdv:2,seedMode:'bands',preRnd:true,h2h:'before',teamReg:true,fxDirect:true,swUnit:'team',
    swFlow:'rounds',swQual:8,swTie:'h2h',swTarget:5,
    win:1,draw:0,loss:0,minMatches:0,thirdPlace:true,fxNames:false,matchMin:25,
    tVar:'mix',tFirst:'a',tPts:3,tPtsKO:5,tPtsF:7,tMars:true});
  return st;
}
function addTawleTour(){
  try{ save(); }catch(e){}
  const r=tregLoad()||{list:[],active:''};
  const id='t'+Date.now().toString(36), key='hsarat_t_'+id;
  let nm=TAWLE_NAME, k=2; while(r.list.some(t=>t.name===nm)) nm=TAWLE_NAME+' ('+(k++)+')';
  const st=tawlePreset(); st.settings.event=nm;
  try{ localStorage.setItem(key,JSON.stringify(st)); }catch(e){ alert('تعذّر إنشاء البطولة — الذاكرة ممتلئة.'); return; }
  r.list.push({id,name:nm,key}); r.active=id; tregSave(r);
  location.reload();
}
function addCardsTour(){
  try{ save(); }catch(e){}
  const r=tregLoad()||{list:[],active:''};
  const id='t'+Date.now().toString(36), key='hsarat_t_'+id;
  let nm=CARDS_NAME, k=2; while(r.list.some(t=>t.name===nm)) nm=CARDS_NAME+' ('+(k++)+')';
  const st=cardsPreset(); st.settings.event=nm;
  try{ localStorage.setItem(key,JSON.stringify(st)); }catch(e){ alert('تعذّر إنشاء البطولة — الذاكرة ممتلئة.'); return; }
  r.list.push({id,name:nm,key}); r.active=id; tregSave(r);
  location.reload();
}
function initTournaments(){
  let r=tregLoad();
  if(!r){ /* جهاز جديد: بطولة الورق الجاهزة هي الافتراضية */
    const key='hsarat_t_cards';
    try{ if(!localStorage.getItem(key)) localStorage.setItem(key,JSON.stringify(cardsPreset())); }catch(e){}
    r={list:[{id:'tcards',name:CARDS_NAME,key}],active:'tcards'}; tregSave(r); }
  if(!r.list.find(x=>x.id===r.active)){ r.active=r.list[0].id; tregSave(r); }
  const t=r.list.find(x=>x.id===r.active);
  KEY=t.key; BKEY=KEY+'_bak'; AKEY=KEY+'_auto';
  return r;
}
function switchTour(id){ try{ save(); }catch(e){} const r=tregLoad(); if(!r) return; r.active=id; tregSave(r); location.reload(); }
function addTour(){
  const n=prompt('اسم البطولة الجديدة:','بطولة الكبار 2026');
  if(!n||!n.trim()) return;
  try{ save(); }catch(e){}
  const r=tregLoad()||{list:[],active:''};
  const id='t'+Date.now().toString(36), key='hsarat_t_'+id;
  const st=DEFAULTS();
  st.settings.event=n.trim(); st.settings.plabel='اللاعبون';
  try{ localStorage.setItem(key,JSON.stringify(st)); }catch(e){ alert('تعذّر إنشاء البطولة — الذاكرة ممتلئة.'); return; }
  r.list.push({id,name:n.trim(),key}); r.active=id; tregSave(r);
  location.reload();
}
function tourSheet(){
  const r=tregLoad(); if(!r) return;
  sheet(`<h2>🏆 البطولات</h2>
    <div class="mini" style="margin-bottom:8px">كل بطولة نظام مستقل كلياً: لاعبوها، جولاتها، إعداداتها، رموزها.
      البطولة المفتوحة الآن معلَّمة ✅.</div>
    <div class="list">${r.list.map(t=>`<div class="it">
      <div class="g"><b>${t.id===r.active?'✅ ':''}${esc(t.name)}</b></div>
      ${t.id!==r.active?`<button class="btn ghost sm" data-tsw="${t.id}" style="width:auto">فتح</button>`:''}
      <button class="iconbtn" data-trn2="${t.id}" title="إعادة تسمية">✎</button>
      ${(r.list.length>1&&t.id!==r.active)?`<button class="iconbtn d" data-tdel="${t.id}">✕</button>`:''}
    </div>`).join('')}</div>
    <button class="btn gold" id="taddC" style="margin-top:10px">🃏 ＋ بطولة الورق 2026 — إعداد جاهز (400 · ليخا · سويسري مستمر)</button>
    <button class="btn gold" id="taddT" style="margin-top:8px">🎲 ＋ بطولة الطاولة 2026 — إعداد جاهز (مجموعات ثم إقصائي · فرنجية ومحبوسة)</button>
    <button class="btn main" id="tadd" style="margin-top:8px">＋ بطولة جديدة فارغة (كبار، ناشئين…)</button>
    <button class="btn ghost" onclick="closeSheet()" style="margin-top:8px">إغلاق</button>`);
  document.querySelectorAll('[data-tsw]').forEach(b=>b.onclick=()=>switchTour(b.dataset.tsw));
  document.querySelectorAll('[data-trn2]').forEach(b=>b.onclick=()=>{
    const t=r.list.find(x=>x.id===b.dataset.trn2); if(!t) return;
    const n=prompt('اسم البطولة:',t.name);
    if(n&&n.trim()){ t.name=n.trim(); tregSave(r); tourSheet(); }
  });
  document.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=()=>{
    const t=r.list.find(x=>x.id===b.dataset.tdel); if(!t) return;
    if(!confirm('حذف بطولة «'+t.name+'» بكل بياناتها؟ (تُحفظ نسخة أخيرة مخفية يمكن استرجاعها عند الحاجة)')) return;
    if(!confirm('تأكيد نهائي.')) return;
    try{
      const data=localStorage.getItem(t.key);
      if(data) localStorage.setItem('hsarat_trash_'+t.key, data);   // نسخة أخيرة قابلة للاسترجاع
      localStorage.removeItem(t.key); localStorage.removeItem(t.key+'_bak'); localStorage.removeItem(t.key+'_auto');
    }catch(e){}
    r.list=r.list.filter(x=>x.id!==t.id); tregSave(r); tourSheet();
  });
  $('#tadd').onclick=addTour;
  $('#taddC').onclick=()=>{ if(confirm('إنشاء «بطولة الورق» جديدة بالإعداد الجاهز وفتحها؟ البطولات الأخرى تبقى كما هي.')) addCardsTour(); };

function tFinals(N){ const o=[]; const ws=tMarsOn()?[N,N+1]:[N];

function vScoreKeys(sets){
  const need=Math.floor(sets/2)+1, out=[];
  for(let l=0;l<need;l++) out.push(need+'-'+l);          /* انتصارات: 3-0، 3-1، 3-2 */
  for(let w=need-1;w>=0;w--) out.push(w+'-'+need);       /* خسائر: 2-3، 1-3، 0-3 */

function vDefMap(sets){
  const need=Math.floor(sets/2)+1, m={};
  vScoreKeys(sets).forEach(k=>{
    const [w,l]=k.split('-').map(Number);
    if(w===need) m[k]=(sets>1&&l===need-1)?2:3;
    else m[k]=(sets>1&&w===need-1)?1:0;
  });

}

function vMap(sets){
  const s=sets||vCfg().sets, def=vDefMap(s), saved=S.settings.vPtsMap||{}, out={};

}

function vState(f,A,B){
  const c=vCfg(), need=vNeed();
  const order={A:((f.vOrder&&f.vOrder.a&&f.vOrder.a.length)?f.vOrder.a.slice():((f.lineup&&f.lineup.a&&f.lineup.a.length)?f.lineup.a.slice():A.ids.slice())),
               B:((f.vOrder&&f.vOrder.b&&f.vOrder.b.length)?f.vOrder.b.slice():((f.lineup&&f.lineup.b&&f.lineup.b.length)?f.lineup.b.slice():B.ids.slice()))};
  const first=f.vFirst==='B'?'B':'A';
  const S2={sets:[],setNo:1,a:0,b:0,serve:first,rot:{A:0,B:0},won:{A:0,B:0},to:{A:0,B:0},
            order,done:false,winner:null,pa:0,pb:0};
  const target=()=>(c.sets>1&&S2.won.A===need-1&&S2.won.B===need-1)?c.ptsF:c.pts;
  const point=side=>{
    if(S2.done) return;
    if(side!==S2.serve){ S2.serve=side; const L=Math.max(1,order[side].length); S2.rot[side]=(S2.rot[side]+1)%L; }
    if(side==='A') S2.a++; else S2.b++;
    const T=target();
    if((S2.a>=T||S2.b>=T)&&Math.abs(S2.a-S2.b)>=2){
      S2.sets.push({a:S2.a,b:S2.b}); S2.pa+=S2.a; S2.pb+=S2.b;
      if(S2.a>S2.b) S2.won.A++; else S2.won.B++;
      if(S2.won.A>=need||S2.won.B>=need){ S2.done=true; S2.winner=S2.won.A>=need?'A':'B'; }
      else{ S2.setNo++; S2.a=0; S2.b=0;

        if(c.rotReset){ S2.rot.A=0; S2.rot.B=0; }
        S2.to.A=0; S2.to.B=0; }
    }
  };
  (f.ev||[]).slice().sort((p,q)=>(p.seq||0)-(q.seq||0)).forEach(e=>{
    if(e.t==='p') point(e.side);
    else if(e.t==='y'||e.t==='r'){ if(c.cardPt) point(e.side==='A'?'B':'A'); }
    else if(e.t==='to'){ if(e.side==='A') S2.to.A++; else S2.to.B++; }

  });
  S2.target=target();
  { const ex=vExpelled(f);
    ['A','B'].forEach(sd=>{ const o=order[sd].filter(id=>!ex.has(id)); if(o.length) order[sd]=o; }); }
  S2.serverId=(order[S2.serve]&&order[S2.serve].length)?order[S2.serve][S2.rot[S2.serve]%order[S2.serve].length]:null;
  return S2;
}

function roundRobin(ids){
  const arr=ids.slice(); if(arr.length%2) arr.push(null);
  const n=arr.length, half=n/2, out=[];
  for(let r=0;r<n-1;r++){
    for(let i=0;i<half;i++){ const a=arr[i], b=arr[n-1-i]; if(a!=null&&b!=null) out.push([a,b]); }
    arr.splice(1,0,arr.pop());
  }
  return out;
}
function fxWinner(f){

  return null;
}

/* ترتيب الفرق من نتائج الدوري/المجموعات: نقاط ثم فارق أهداف ثم المسجَّل —
   مع «المواجهة المباشرة» بين المتعادلين (v67، إعداد h2h):
   'after' (الافتراضي) = نقاط ← فارق ← مواجهة مباشرة ← مسجَّل ← انتصارات (أسلوب فيفا/بريميرليغ)
   'before' = نقاط ← مواجهة مباشرة ← فارق ← مسجَّل ← انتصارات (أسلوب ويفا/الليغا)
   'off' = بلا مواجهة مباشرة (النظام السابق) */
function teamStand(fxPred,tmPred){
  const st=S.settings, rows={};
  S.teams.filter(t=>(!tmPred||tmPred(t))).forEach(t=>rows[t.id]={t,P:0,W:0,D:0,L:0,GF:0,GA:0,PF:0,PA:0,Pts:0});
  const fxs=S.fixtures.filter(f=>fxPred(f)&&f.ga!=null&&f.gb!=null);
  fxs.forEach(f=>{
    const ra=rows[f.a], rb=rows[f.b]; if(!ra||!rb) return;
    if(f.solo){ /* v87: تكميلية — تُحتسب لفريق واحد فقط */
      const r=rows[f.solo]; if(!r) return; const isA=f.a===f.solo, gf=isA?f.ga:f.gb, gg=isA?f.gb:f.ga;
      r.P++; r.GF+=gf; r.GA+=gg;
      if(gf>gg){ r.W++; r.Pts+=st.win; } else if(gf<gg){ r.L++; r.Pts+=st.loss; } else { r.D++; r.Pts+=st.draw; }
      return; }
    ra.P++; rb.P++; ra.GF+=f.ga; ra.GA+=f.gb; rb.GF+=f.gb; rb.GA+=f.ga;
    ra.PF+=Number(f.pa)||0; ra.PA+=Number(f.pb)||0; rb.PF+=Number(f.pb)||0; rb.PA+=Number(f.pa)||0;
    if(isVolley()){
      if(f.ga>f.gb){ ra.W++; rb.L++; } else if(f.gb>f.ga){ rb.W++; ra.L++; }
      ra.Pts+=vTblPts(f.ga,f.gb); rb.Pts+=vTblPts(f.gb,f.ga);
    }
    else if(f.ga>f.gb){ ra.W++; rb.L++; ra.Pts+=st.win; rb.Pts+=st.loss; }
    else if(f.gb>f.ga){ rb.W++; ra.L++; rb.Pts+=st.win; ra.Pts+=st.loss; }
    else { ra.D++; rb.D++; ra.Pts+=st.draw; rb.Pts+=st.draw; }
  });
  if(isSwissTeam()) (Array.isArray(S.swBye)?S.swBye:[]).forEach(e=>{
    const r=rows[e.t]; if(r){ r.P++; r.W++; r.Pts+=swByePts(); } });
  return sortStand(Object.values(rows),fxs.filter(f=>!f.solo));
}
/* الفرز المتسلسل: عند كل مستوى، المجموعة المتعادلة تُحسم بالمستوى التالي.
   «المواجهة المباشرة» = جدول مصغّر (نقاط/فارق/مسجَّل) من المباريات بين المتعادلين فقط —
   بين فرق من مجموعات مختلفة ما في مواجهات، فتبقى المعايير العامة هي الفاصلة */
function sortStand(list,fxs){
  const st=S.settings;
  const mode=st.h2h==='before'?'before':st.h2h==='off'?'off':'after';
  const lv={
    pts:(a,b)=>b.Pts-a.Pts,
    gd:(a,b)=>(b.GF-b.GA)-(a.GF-a.GA),
    gf:(a,b)=>b.GF-a.GF,
    pd:(a,b)=>((b.PF||0)-(b.PA||0))-((a.PF||0)-(a.PA||0)),
    w:(a,b)=>b.W-a.W,
    no:(a,b)=>a.t.no-b.t.no};
  let chain=mode==='before'?[lv.pts,'h2h',lv.gd,lv.gf,lv.w,lv.no]
            :mode==='off'   ?[lv.pts,lv.gd,lv.gf,lv.w,lv.no]
                            :[lv.pts,lv.gd,'h2h',lv.gf,lv.w,lv.no];
  /* الطائرة: بعد فارق الأشواط يأتي فارق النقاط، ثم الباقي */
  if(isVolley()){ const i=chain.indexOf(lv.gd); if(i>=0) chain=chain.slice(0,i+1).concat([lv.pd],chain.slice(i+1)); }
  /* الورق (v84): بعد النقاط/الفوز — بالسويسري «بوخهولز» (مجموع نقاط الخصوم: من لاقى الأقوى يتقدّم)،
     ثم فارق نقاط الورق (بليخا الأقل أفضل)، ثم الباقي */
  if(isCards()||isTawle()){
    const extra=[];
    if(isSwissTeam()){
      const P={}, bh={}; list.forEach(r=>{ P[r.t.id]=r.Pts; bh[r.t.id]=0; });
      fxs.forEach(f=>{ if(bh[f.a]!=null&&P[f.b]!=null) bh[f.a]+=P[f.b]; if(bh[f.b]!=null&&P[f.a]!=null) bh[f.b]+=P[f.a]; });
      list.forEach(r=>r.BH=bh[r.t.id]||0); extra.push((a,b)=>(b.BH||0)-(a.BH||0));
    }
    if(isSwissTeam()&&swTieRule()==='h2h'){   /* v90: النقاط ← المواجهة المباشرة ← بوخهولز ← فارق الأشواط */
      chain=[lv.pts,'h2h'].concat(extra,[lv.gd,lv.gf,lv.w,lv.no]);
    } else { const i=chain.indexOf(lv.gd); if(i>=0) chain=chain.slice(0,i).concat(extra,chain.slice(i)); }
  }
  const h2hCmp=rows=>{
    const ids=new Set(rows.map(r=>r.t.id)), m={};
    rows.forEach(r=>m[r.t.id]={p:0,gd:0,gf:0});
    fxs.forEach(f=>{
      if(!ids.has(f.a)||!ids.has(f.b)) return;
      m[f.a].gd+=f.ga-f.gb; m[f.b].gd+=f.gb-f.ga; m[f.a].gf+=f.ga; m[f.b].gf+=f.gb;
      if(isVolley()){ m[f.a].p+=vTblPts(f.ga,f.gb); m[f.b].p+=vTblPts(f.gb,f.ga); }
      else if(f.ga>f.gb){ m[f.a].p+=st.win; m[f.b].p+=st.loss; }
      else if(f.gb>f.ga){ m[f.b].p+=st.win; m[f.a].p+=st.loss; }
      else { m[f.a].p+=st.draw; m[f.b].p+=st.draw; }
    });
    return (a,b)=>m[b.t.id].p-m[a.t.id].p||m[b.t.id].gd-m[a.t.id].gd||m[b.t.id].gf-m[a.t.id].gf;
  };
  const met=(x,y)=>fxs.some(f=>(f.a===x&&f.b===y)||(f.a===y&&f.b===x));
  const order=(rows,li)=>{
    if(rows.length<=1||li>=chain.length) return rows;
    if(chain[li]==='h2h'){
      let complete=true;
      outer: for(let i=0;i<rows.length;i++) for(let j=i+1;j<rows.length;j++)
        if(!met(rows[i].t.id,rows[j].t.id)){ complete=false; break outer; }
      if(!complete){
        /* متعادلون لم يلتقوا جميعاً (عبر المجموعات — v71):
           أبناء المجموعة الواحدة مواجهاتهم كاملة فيُرتَّبون بينهم بمعاييرهم الكاملة (المواجهة تفصل)،
           ثم تُدمَج سلاسل المجموعات بالمعايير التالية (الفارق فالمسجَّل) —
           فمن ربح مواجهته المباشرة لا ينزل تحت خصمه أبداً، ومن لم يلتقيا يفصل بينهما الفارق */
        const grp={}, singles=[];
        rows.forEach(r=>{ const g=r.t.group; if(g==null) singles.push([r]); else (grp[g]=grp[g]||[]).push(r); });
        const gkeys=Object.keys(grp);
        /* كلهم من مجموعة واحدة (ومواجهاتهم ناقصة أصلاً): لا شيء يُفصَل هنا — المعيار التالي */
        if(gkeys.length+singles.length<=1) return order(rows,li+1);
        const lists=singles.slice();
        gkeys.forEach(g=>lists.push(grp[g].length>1?order(grp[g],0):grp[g]));
        const restCmp=(a,b)=>{ for(let i=li+1;i<chain.length;i++){ if(chain[i]==='h2h') continue; const v=chain[i](a,b); if(v) return v; } return 0; };
        const out=[], ptr=lists.map(()=>0);
        while(out.length<rows.length){
          let best=-1;
          for(let i=0;i<lists.length;i++){ if(ptr[i]>=lists[i].length) continue;
            if(best<0||restCmp(lists[i][ptr[i]],lists[best][ptr[best]])<0) best=i; }
          out.push(lists[best][ptr[best]++]);
        }
        return out;
      }
    }
    const c=chain[li]==='h2h'?h2hCmp(rows):chain[li];
    const s=rows.slice().sort(c), out=[]; let i=0;
    while(i<s.length){ let j=i+1; while(j<s.length&&c(s[i],s[j])===0) j++; out.push(...order(s.slice(i,j),li+1)); i=j; }
    return out;
  };
  return order(list,0);
}

/* ---------- النقاط: تُحسب دائماً من نتائج المباريات ---------- */
function stats(){
  const m={};
  S.kids.forEach(k=>m[k.id]={id:k.id,pts:0,played:0,w:0,d:0,l:0,hist:[]});
  const st=S.settings;
  S.rounds.forEach(r=>r.matches.forEach(mt=>{
    if(!mt.result) return;
    mt.teams.forEach((team,ti)=>{
      let p,f;
      if(mt.result==='D'){ p=st.draw; f='d'; }
      else if((mt.result==='A'&&ti===0)||(mt.result==='B'&&ti===1)){ p=st.win; f='w'; }
      else { p=st.loss; f='l'; }
      team.forEach(id=>{ if(!m[id])return; m[id].pts+=p; m[id].played++; m[id][f]++; m[id].hist.push(p); });
    });
  }));
  /* السويسري: المستريح (العدد فردي) يأخذ نقاط فوز عن جولته */
  if(st.mode==='swiss') S.rounds.forEach(r=>{
    if(r.bye&&m[r.bye]){ const x=m[r.bye]; x.pts+=st.win; x.played++; x.w++; x.hist.push(st.win); }
  });
  /* مباريات الفرق الثابتة تُحتسب أيضاً للاعبين — إلا مباريات كأس النهائي الفردي (cnt:false).
     التشكيلة تُلتقط لحظة تسجيل النتيجة (ra/rb) فلا يأخذ لاعب متأخر نقاط مباريات لم يلعبها.
     خيار «احتساب نصف النهائي والنهائي» (cupCnt) يعيد نقاط S وF للترتيب —
     مباراة المركز الثالث (T) لا تُحتسب أبداً. */
  const applyFx=(fx,rosterA,rosterB)=>{
    if(fx.ga==null||fx.gb==null) return;
    const res=fx.ga>fx.gb?'A':fx.gb>fx.ga?'B':'D';
    [['A',rosterA],['B',rosterB]].forEach(([side,roster])=>{
      let p,f;
      if(res==='D'){ p=st.draw; f='d'; }
      else if(res===side){ p=st.win; f='w'; }
      else { p=st.loss; f='l'; }
      (roster||[]).forEach(id=>{ if(!m[id])return; m[id].pts+=p; m[id].played++; m[id][f]++; m[id].hist.push(p); });
    });
  };
  S.fixtures.forEach(fx=>{
    if(!fxCounts(fx)) return;
    if(fx.solo){ applyFx(fx, fx.solo===fx.a?(fx.ra||team(fx.a).kids):[], fx.solo===fx.b?(fx.rb||team(fx.b).kids):[]); return; }
    applyFx(fx, fx.ra||team(fx.a).kids, fx.rb||team(fx.b).kids);
  });
  /* بعد قرعة الدمج تُنقَل مباريات نصف النهائي للأرشيف — تُحتسب من هناك (آخر أرشفة فقط، بلا ازدواج) */
  const arc=cupSemiArc();
  if(arc) (arc.fixtures||[]).forEach(fx=>{
    if(fx.stage!=='S') return;
    applyFx(fx, fx.ra||[], fx.rb||[]);
  });
  return m;
}
/* v65: خيار احتساب كأس النهائي الفردي بالترتيب — S وF نعم، T (المركز الثالث) لا */
const cupOn=()=>S.settings.cupCnt===true;
const fxCounts=fx=>fx.cnt!==false||(cupOn()&&(fx.stage==='S'||fx.stage==='F'));
const cupSemiArc=()=>{
  if(!cupOn()) return null;
  return (S.archive||[]).slice().reverse().find(a=>String(a.label).includes('نصف النهائي كبار/صغار'))||null;
};
/* أهداف كل لاعب من فيشات المباريات الحالية (بلا الأرشيف) */
function goalsMap(cntOnly){
  const g={};
  collectFiches(false,cntOnly).forEach(f=>f.ev.forEach(e=>{ if(e.t==='g'&&e.kid) g[e.kid]=(g[e.kid]||0)+1; }));
  return g;
}
/* بطاقات مباراة واحدة لكل لاعب — إنذاران بنفس المباراة = الطرد بينهما تلقائي
   فلا يُحتسب طرداً إضافياً (يُخصم الإنذاران فقط). الطرد المباشر، أو طرد بمباراة
   أخرى غير مباراة الإنذارين، يُحتسب كاملاً. */
function ficheCards(f){
  const per={};
  ((f&&f.ev)||[]).forEach(e=>{
    if(!e.kid) return;
    if(e.t==='y'){ (per[e.kid]=per[e.kid]||{y:0,r:0}).y++; }
    else if(e.t==='r'){ (per[e.kid]=per[e.kid]||{y:0,r:0}).r++; }
  });
  for(const k in per){ const p=per[k]; if(p.y>=2&&p.r) p.r--; }
  return per;
}
/* بطاقات كل لاعب (إنذارات وطرد) من فيشات المباريات الحالية */
function cardsMap(cntOnly){
  const c={};
  collectFiches(false,cntOnly).forEach(f=>{
    const per=ficheCards(f);
    for(const k in per){ const cc=(c[k]=c[k]||{y:0,r:0}); cc.y+=per[k].y; cc.r+=per[k].r; }
  });
  return c;
}
function table(){
  const m=stats(), st=S.settings;
  const bestn=st.rankMode==='bestn'||st.rankMode==='total';
  /* مكافأة الأهداف وخصم البطاقات من المباريات المحتسبة فقط — الكأس (cnt:false) خارجها.
     rankMode='total': مجموع نقاط كل المباريات بلا سقف N وبلا معدّل */
  const gm=goalsMap(true), cm=cardsMap(true);
  const N=st.rankMode==='total'?1e9:Math.max(1,Number(st.rankN)||5), gp=Number(st.goalPts)||0;
  const yp=Number(st.yPen)||0, rp=Number(st.rPen)||0;   /* خصم البطاقات */
  const rows=S.kids.map(k=>{
    const s=m[k.id]||{pts:0,played:0,w:0,d:0,l:0,hist:[]};
    const gls=gm[k.id]||0;
    const cd=cm[k.id]||{y:0,r:0};
    const bN=(s.hist||[]).slice().sort((a,b)=>b-a).slice(0,N).reduce((a,b)=>a+b,0);
    return {...k, ...s, gls, ycnt:cd.y, rcnt:cd.r, bestN:bN,
      score:bN+gp*gls-yp*cd.y-rp*cd.r,
      avg: s.played? s.pts/s.played : 0, ok: s.played>=Number(st.minMatches||0)};
  });
  if(bestn) return rows.sort((a,b)=>{
    if(a.ok!==b.ok) return a.ok?-1:1;
    if(b.score!==a.score) return b.score-a.score;
    if(b.gls!==a.gls) return b.gls-a.gls;      /* الفصل: الأهداف ثم مجموع النقاط الكلي */
    if(b.pts!==a.pts) return b.pts-a.pts;
    return a.no-b.no;
  });
  return rows.sort((a,b)=>{
    if(a.ok!==b.ok) return a.ok?-1:1;
    if(b.avg!==a.avg) return b.avg-a.avg;
    if(b.pts!==a.pts) return b.pts-a.pts;
    if(b.played!==a.played) return b.played-a.played;
    return a.no-b.no;
  });
}
const playedMap=()=>{const m=stats();const o={};for(const k in m)o[k]=m[k].played;return o;};
/* كم مرة اختير اللاعب في القرعة (بغضّ النظر عن تسجيل النتيجة) — لكشف التفاوت في الاختيار */
function drawnMap(){
  const m={};
  S.rounds.forEach(r=>r.matches.forEach(mt=>mt.teams.forEach(t=>t.forEach(id=>{ m[id]=(m[id]||0)+1; }))));
  return m;
}

}

function askCode(o){
  let buf='';
  const pin=String(o.pin||'');
  sheet(`<h2>${esc(o.title||'الرمز')}</h2>
    ${o.sub?`<div class="mini" style="text-align:center;margin-bottom:8px">${esc(o.sub)}</div>`:''}
    <div class="pinbox" id="pb"><i></i><i></i><i></i><i></i></div>
    <div style="text-align:center;font-size:13.5px;color:var(--red);min-height:20px" id="pmsg"></div>
    <div class="pad" id="pad"></div>
    <div style="margin-top:12px"><button class="btn ghost" onclick="closeSheet()">إلغاء</button></div>`);
  const pad=$('#pad');
  const draw=()=>document.querySelectorAll('#pb i').forEach((e,i)=>e.className=i<buf.length?'f':'');
  const done=()=>{ closeSheet(); o.onOK&&o.onOK(); };
  const press=v=>{
    if(v==='<'){ buf=buf.slice(0,-1); draw(); return; }
    if(buf.length>=4) return;
    buf+=v; draw();
    if(buf.length===4) setTimeout(()=>{
      if(buf===pin) done();
      else { buf=''; draw(); $('#pmsg').textContent='رمز غير صحيح'; }
    },120);
  };
  '123456789'.split('').forEach(d=>{const b=el('button','',d);b.onclick=()=>press(d);pad.appendChild(b);});
  const sp=el('button','alt',' '); sp.style.visibility='hidden'; pad.appendChild(sp);
  const z=el('button','','0'); z.onclick=()=>press('0'); pad.appendChild(z);
  const bk=el('button','alt','مسح'); bk.onclick=()=>press('<'); pad.appendChild(bk);
  const kh=e=>{ if(e.key>='0'&&e.key<='9') press(e.key); else if(e.key==='Backspace') press('<'); };
  document.addEventListener('keydown',kh);
  let word='', wh=null;
  if(o.recovery){
    wh=e=>{ if(e.key.length===1&&/[A-Za-z]/.test(e.key)){ word=(word+e.key).slice(-6).toLowerCase();
      if(word==='hsarat'){ done(); alert('فُتح وضع الإدارة. يُستحسن تغيير الرمز من الإعدادات.'); } } };
    document.addEventListener('keydown',wh);
  }
  const mo=new MutationObserver(()=>{ if(!$('#mask').classList.contains('on')){
    document.removeEventListener('keydown',kh); if(wh) document.removeEventListener('keydown',wh); mo.disconnect(); } });
  mo.observe($('#mask'),{attributes:true});
}

}

/* تصدير لائحة الأولاد CSV — يفتح مباشرة في Excel.
   الهاتف يُكتب بصيغة ="..." كي لا يحذف Excel الصفر الأول (03… يبقى 03…) */
function exportKidsCSV(){
  const q=s=>{s=String(s??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const pl=playedMap();
  const rows=[['الرقم','الاسم','سنة الولادة','الجنس','رقم الهاتف','الفريق','حاضر','لعب'].map(q).join(',')]
    .concat(S.kids.slice().sort((a,b)=>a.no-b.no).map(k=>[
      q(k.no), q(k.name), q(k.year||''), q(k.g==='g'?'بنت':'صبي'),
      k.phone?'="'+String(k.phone).replace(/"/g,'')+'"':'',
      q(kidTeam(k.id)?kidTeam(k.id).name:''),
      q(k.present?'نعم':'لا'), q(pl[k.id]||0)
    ].join(',')));
  const d=new Date();
  dl(`لائحة-الأولاد-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}.csv`,
     new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));
}
/* مباريات لاعب معيّن مع روابط مباشرة لفيشاتها */
function playerMatches(k){
  const resTxt=m=>m.result==='A'?'فاز الأول':m.result==='B'?'فاز الثاني':m.result==='D'?'تعادل':'بلا نتيجة';
  const tn=id=>{ const t=S.teams.find(x=>x.id===id); return t?t.name:'فريق'; };
  /* أحداث هذا اللاعب تحديداً داخل مباراة معيّنة: أهدافه، بطاقاته، دخوله وخروجه */
  const mineOf=m=>{
    const f=m&&m.fiche; if(!f||!f.ev||!f.ev.length) return '';
    let g=0,y=0,rr=0; const bits=[];
    f.ev.forEach(e=>{
      if(e.kid===k.id){
        if(e.t==='g') g++;
        else if(e.t==='y') y++;
        else if(e.t==='r') rr++;
        else if(e.t==='s') bits.push('🔁 خرج د'+fmtEvMin(e.min));
      }
      else if(e.kid2===k.id&&e.t==='s') bits.push('🔁 دخل د'+fmtEvMin(e.min));
    });
    const dropAuto=(y>=2&&rr>0);   /* الطرد بالإنذارين لا يُعرض طرداً مستقلاً */
    if(dropAuto) rr--;
    const parts=[];
    if(g) parts.push('⚽ '+g);
    if(y) parts.push('🟨 '+y+(dropAuto?' (إنذاران=طرد)':''));
    if(rr) parts.push('🟥 '+rr);
    parts.push(...bits);
    return parts.join(' · ');
  };
  const items=[];
  S.rounds.forEach(r=>r.matches.forEach(m=>{
    if(m.teams.some(t=>t.includes(k.id)))
      items.push({mid:m.id,label:'الجولة '+r.no+' · مباراة '+m.no,ts:m.ts||r.ts,res:resTxt(m),mine:mineOf(m)});
  }));
  if(isCards()){ gameSync(); cGames().forEach(g=>{ const gx=(S.gfx||{})[g.id]; if(!gx||g.id===cGame().id) return;
    const tN=id=>{ const t=(gx.teams||[]).find(x=>x.id===id); return t?t.name:'فريق'; };
    (gx.fixtures||[]).forEach(fx=>{ const tA=(gx.teams||[]).find(x=>x.id===fx.a)||{kids:[]}, tB=(gx.teams||[]).find(x=>x.id===fx.b)||{kids:[]};
      const inFx=fx.ga!=null?((fx.ra||[]).includes(k.id)||(fx.rb||[]).includes(k.id)):(tA.kids.includes(k.id)||tB.kids.includes(k.id));
      if(inFx) items.push({mid:null,label:'🃏 '+g.name+' · '+(STAGEN[fx.stage]||'')+' — '+tN(fx.a)+' ضد '+tN(fx.b),ts:fx.ts,
        res:fx.ga!=null?('<b style="direction:ltr;unicode-bidi:isolate">'+fx.ga+' - '+fx.gb+'</b>'):'بلا نتيجة',mine:''}); }); }); }
  S.fixtures.forEach(fx=>{
    const saved=fx.ga!=null;
    const inFx=saved?((fx.ra||[]).includes(k.id)||(fx.rb||[]).includes(k.id))
      :((S.teams.find(t=>t.id===fx.a)||{kids:[]}).kids.includes(k.id)||(S.teams.find(t=>t.id===fx.b)||{kids:[]}).kids.includes(k.id));
    if(inFx) items.push({mid:fx.id,label:(isCards()?'🃏 '+cGame().name+' · ':'')+(STAGEN[fx.stage]||'')+' — '+tn(fx.a)+' ضد '+tn(fx.b),ts:fx.ts,
      res:saved?('<b style="direction:ltr;unicode-bidi:isolate">'+fx.gb+' - '+fx.ga+'</b>'):'بلا نتيجة',mine:mineOf(fx)});
  });
  (S.archive||[]).forEach(a=>{
    (a.rounds||[]).forEach(r=>(r.matches||[]).forEach(m=>{
      if((m.teams||[]).some(t=>t.includes(k.id)))
        items.push({mid:m.id,label:'📚 '+a.label,ts:m.ts||r.ts,res:resTxt(m),mine:mineOf(m)});
    }));
    (a.fixtures||[]).forEach(fx=>{
      if((fx.ra||[]).includes(k.id)||(fx.rb||[]).includes(k.id))
        items.push({mid:fx.id,label:'📚 '+a.label,ts:fx.ts,
          res:fx.ga!=null?('<b style="direction:ltr;unicode-bidi:isolate">'+fx.gb+' - '+fx.ga+'</b>'):'—',mine:mineOf(fx)});
    });
  });
  /* إحصاءاته من فيشات كل المباريات (مع الأرشيف) */
  let g=0,y=0,rc=0;
  collectFiches(true).forEach(f=>{
    f.ev.forEach(e=>{ if(e.kid===k.id&&e.t==='g') g++; });
    const p=ficheCards(f)[k.id]; if(p){ y+=p.y; rc+=p.r; }
  });
  items.sort((a,b)=>String(b.ts||'').localeCompare(String(a.ts||'')));
  sheet(`<h2>📋 مباريات ${esc(k.name)}${ageTxt(k.id)}</h2>
    <div class="okbox">شارك في <b>${items.length}</b> مباراة · ⚽ ${g} · 🟨 ${y} · 🟥 ${rc}</div>
    ${items.length?`<div class="list">${items.map(it=>`<div class="it">
      <div class="g"><b>${it.label}</b><small>${it.res}${it.ts?' · '+fmtDT(it.ts):''}${it.mine?'<br><b style="color:var(--green)">'+it.mine+'</b>':''}</small></div>
      ${it.mid?`<button class="btn ghost sm" data-pmf="${it.mid}" style="width:auto;padding:6px 12px">📋 ${isCards()?'التفاصيل':'الفيش'}</button>`:''}</div>`).join('')}</div>`
    :'<div class="empty">لم يشارك في أي مباراة بعد</div>'}
    <button class="btn ghost" onclick="closeSheet()" style="margin-top:10px">إغلاق</button>`);
  document.querySelectorAll('#sheet [data-pmf]').forEach(b=>b.onclick=()=>{ if(isCards()&&S.fixtures.some(f=>f.id===b.dataset.pmf)) fxDetail(b.dataset.pmf); else openFiche(b.dataset.pmf); });
}

/* دمج سجل لاعب مكرر (سُجّل مرتين بالخطأ) في السجل الصحيح:
   كل أحداث الفيش (أهداف/بطاقات/تبديلات)، التشكيلات، تشكيلات النتائج المحفوظة (ra/rb)،
   عضوية الفرق، فرق مباريات الجولات وقوائم الجلوس — بالحاضر والأرشيف — تنتقل للسجل
   الصحيح، ويُحذف المكرر. يعيد ملخص ما نُقل. */
function mergeKid(dupId,keepId){
  if(dupId===keepId) return null;
  const dup=S.kids.find(x=>x.id===dupId), keep=S.kids.find(x=>x.id===keepId);
  if(!dup||!keep) return null;
  autoBackup('قبل دمج «'+dup.name+'» في «'+keep.name+'»',true);
  const mv={g:0,y:0,r:0,ev:0,mt:0};
  const fixArr=a=>{ if(!Array.isArray(a)) return a;
    const out=[], seen=new Set();
    a.forEach(id=>{ const v=(id===dupId?keepId:id); if(!seen.has(v)){ seen.add(v); out.push(v); } });
    return out; };
  const fixFiche=f=>{ if(!f) return;
    (f.ev||[]).forEach(e=>{
      if(e.kid===dupId){ e.kid=keepId; mv.ev++;
        if(e.t==='g')mv.g++; else if(e.t==='y')mv.y++; else if(e.t==='r')mv.r++; }
      if(e.kid2===dupId) e.kid2=keepId;
      if(e.rfor===dupId) e.rfor=keepId;
    });
    if(f.lineup){ f.lineup.a=fixArr(f.lineup.a||[]); f.lineup.b=fixArr(f.lineup.b||[]); } };
  const fixRound=r=>(r.matches||[]).forEach(m=>{
    if((m.teams||[]).some(t=>t.includes(dupId))) mv.mt++;
    m.teams=(m.teams||[]).map(fixArr); fixFiche(m.fiche);
    if(r.sitting) r.sitting=fixArr(r.sitting);
  });
  const fixFx=fx=>{ if((fx.ra||[]).includes(dupId)||(fx.rb||[]).includes(dupId)) mv.mt++;
    if(fx.ra) fx.ra=fixArr(fx.ra); if(fx.rb) fx.rb=fixArr(fx.rb); fixFiche(fx.fiche); };
  S.rounds.forEach(fixRound);
  S.fixtures.forEach(fixFx);
  S.teams.forEach(t=>t.kids=fixArr(t.kids));
  (S.archive||[]).forEach(a=>{
    (a.rounds||[]).forEach(fixRound);
    (a.fixtures||[]).forEach(fixFx);
    (a.teams||[]).forEach(t=>t.kids=fixArr(t.kids));
  });
  S.kids=S.kids.filter(x=>x.id!==dupId);
  save();
  return mv;
}
/* ===== اكتشاف السجلات المكررة (نفس الشخص مسجّل مرتين بإملاء مختلف) ===== */
function dupNorm(s){ return String(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9؀-ۿ]/g,''); }
/* معامل دايس على ثنائيات الأحرف — يلتقط jak/jack وyazbek/yazbeck */
function dupSim(a,b){
  a=dupNorm(a); b=dupNorm(b);
  if(!a||!b) return 0;
  if(a===b) return 1;
  const bg=s=>{ const m={}; for(let i=0;i<s.length-1;i++){ const t=s.slice(i,i+2); m[t]=(m[t]||0)+1; } return m; };
  const A=bg(a),B=bg(b); let inter=0,na=0,nb=0;
  for(const k in A) na+=A[k];
  for(const k in B) nb+=B[k];
  for(const k in A) if(B[k]) inter+=Math.min(A[k],B[k]);
  return (na+nb)?2*inter/(na+nb):0;
}
/* غنى السجل بالبيانات — الدمج يقترح إبقاء الأغنى */
function kidActivity(id){
  let ev=0,ap=0;
  const cf=f=>{ if(f&&f.ev) f.ev.forEach(e=>{ if(e.kid===id||e.kid2===id) ev++; }); };
  S.rounds.forEach(r=>r.matches.forEach(m=>{ if((m.teams||[]).some(t=>t.includes(id))) ap++; cf(m.fiche); }));
  S.fixtures.forEach(fx=>{ if((fx.ra||[]).includes(id)||(fx.rb||[]).includes(id)) ap++; cf(fx.fiche); });
  return ev*3+ap;
}
function dupSheet(){
  const list=[];
  for(let i=0;i<S.kids.length;i++) for(let j=i+1;j<S.kids.length;j++){
    const sim=dupSim(S.kids[i].name,S.kids[j].name);
    if(sim>=0.82) list.push({a:S.kids[i],b:S.kids[j],sim});
  }
  list.sort((x,y)=>y.sim-x.sim);
  const gm=goalsMap();
  const row=p=>{
    const ta=kidTeam(p.a.id), tb=kidTeam(p.b.id);
    const keep=kidActivity(p.a.id)>=kidActivity(p.b.id)?p.a:p.b;
    const dup=keep===p.a?p.b:p.a;
    const info=k=>`${k.no}. ${esc(k.name)}${ageTxt(k.id)}${kidTeam(k.id)?' · '+esc(kidTeam(k.id).name):''} · ⚽ ${gm[k.id]||0}`;
    const warn=(ta&&tb&&ta.id!==tb.id)?'<div class="warnbox" style="margin:4px 0">⚠️ بفريقين مختلفين — تأكد أنهما نفس الشخص فعلاً!</div>':'';
    return `<div class="it" style="flex-direction:column;align-items:stretch;gap:4px">
      <div class="g"><b>تشابه ${Math.round(p.sim*100)}%</b><small>${info(p.a)}<br>${info(p.b)}</small></div>${warn}
      <button class="btn ghost sm" data-dmg="${dup.id}|${keep.id}" style="border-color:#E8D08A;color:#6B5210">⇆ دمج «${esc(dup.name)}» في «${esc(keep.name)}» (الأغنى بيانات)</button>
    </div>`;
  };
  sheet(`<h2>🔍 السجلات المكررة المحتملة</h2>
    <div class="mini" style="margin-bottom:8px">قورنت أسماء <b>${S.kids.length}</b> لاعباً — الأزواج المتشابهة ٨٢٪ فأكثر.
      الدمج ينقل كل الأهداف والبطاقات والمباريات والتشكيلات إلى السجل الباقي ويحذف المكرر (مع نسخة احتياطية تلقائية).
      <b>القرار لك</b> — بعض المتشابهين قد يكونان شخصين حقيقيين (أخوة أو أقارب).</div>
    ${list.length?`<div class="list">${list.map(row).join('')}</div>`:'<div class="empty">لا أسماء متشابهة — اللائحة نظيفة ✔</div>'}
    <button class="btn ghost" onclick="closeSheet()" style="margin-top:8px">إغلاق</button>`);
  document.querySelectorAll('#sheet [data-dmg]').forEach(b=>b.onclick=()=>{
    const parts=b.dataset.dmg.split('|'), dupId=parts[0], keepId=parts[1];
    const dup=S.kids.find(x=>x.id===dupId), keep=S.kids.find(x=>x.id===keepId);
    if(!dup||!keep) return;
    if(!confirm('دمج «'+dup.name+'» في «'+keep.name+'»؟\nكل شيء ينتقل ويُحذف السجل المكرر نهائياً.')) return;
    const apply=()=>{
      const mv=mergeKid(dupId,keepId); if(!mv) return;
      renderKids(); renderHeader(); renderPlay();
      alert('✔ تم الدمج في «'+keep.name+'»:\n⚽ '+mv.g+' · 🟨 '+mv.y+' · 🟥 '+mv.r+' · مشاركات مباريات: '+mv.mt);
      dupSheet();
    };
    const dp=String(S.settings.delPin||'');
    if(dp) askCode({title:'دمج سجلين', sub:'أدخل رمز الحذف', pin:dp, onOK:apply});
    else if(hasPin()) askCode({title:'دمج سجلين', sub:'أدخل رمز الإعدادات', pin:S.settings.pin, recovery:true, onOK:apply});
    else apply();
  });
}

/* ===== السويسري بالفرق (v78) — فرق ثابتة تتزاوج كل جولة بحسب الترتيب ===== */
const isSwissTeam=()=>S.settings.mode==='swiss'&&(S.settings.swUnit==='team'||isVolley()||isCards()||isTawle());
const swFx=()=>S.fixtures.filter(f=>f.stage==='L');

function swByeList(){ if(!Array.isArray(S.swBye)) S.swBye=[]; return S.swBye; }
function swByePts(){ return isVolley()?vTblPts(vNeed(),0):(Number(S.settings.win)||0); }
function swissDrawTeams(){
  if(gTeams().length<2){ alert('يلزم فريقان مسجّلان على الأقل.'); return; }
  if(S.fixtures.some(isKO)){ alert('الختام الإقصائي أُنشئ — لا تزاوج جديد. ألغِه أولاً (↩) إن أردت جولة إضافية.'); return; }
  if(swFx().some(f=>f.ga==null)&&!confirm('توجد مباريات بلا نتيجة — التزاوج يُبنى على النتائج. المتابعة؟')) return;
  let ord=teamStand(f=>f.stage==='L').map(r=>r.t.id);
  gTeams().forEach(t=>{ if(!ord.includes(t.id)) ord.push(t.id); });
  /* v92: فريق فيه لاعب غائب أو ناقص أو موقوف لا يدخل التزاوج */
  const skip=gTeams().filter(t=>teamUnavail(t)); if(skip.length){ ord=ord.filter(id=>!skip.some(t=>t.id===id));
    if(!confirm('خارج هذه الجولة: '+skip.map(t=>t.name+' ('+teamUnavail(t)+')').join('، ')+'\nمتابعة التزاوج؟')) return; }
  const met={};
  swFx().forEach(f=>{ (met[f.a]=met[f.a]||new Set()).add(f.b); (met[f.b]=met[f.b]||new Set()).add(f.a); });
  const byes=new Set(swByeList().map(x=>x.t));
  let pool=ord.slice(), bye=null;
  if(pool.length%2){ let bi=pool.length-1;
    for(let i=pool.length-1;i>=0;i--) if(!byes.has(pool[i])){ bi=i; break; }
    bye=pool.splice(bi,1)[0]; }
  const pairs=[], used=new Array(pool.length).fill(false);
  for(let i=0;i<pool.length;i++){
    if(used[i]) continue; used[i]=true;
    let j=-1;
    for(let k=i+1;k<pool.length;k++){ if(used[k]) continue;
      if(!(met[pool[i]]&&met[pool[i]].has(pool[k]))){ j=k; break; } }
    if(j<0) for(let k=i+1;k<pool.length;k++){ if(!used[k]){ j=k; break; } }
    if(j<0) continue;
    used[j]=true; pairs.push([pool[i],pool[j]]);
  }
  const rno=swRoundNo()+1;
  pairs.forEach(p=>{ S.fseq++;
    S.fixtures.push({id:uid('f'),no:S.fseq,stage:'L',group:null,swr:rno,
      a:p[0],b:p[1],ga:null,gb:null,pens:null,cnt:true,ts:nowISO()}); });
  if(bye) swByeList().push({t:bye,r:rno});
  save(); autoBackup('بعد تزاوج سويسري (فرق)');
  renderPlay(); renderHeader();
  const mn=document.querySelector('main'); if(mn) mn.scrollTop=0;
}

/* =============== النظام السويسري (v73) ===============

   العدد الفردي: الأدنى ترتيباً (ممن لم يسترح) يستريح ويأخذ نقاط فوز (r.bye). */
function renderPlaySwiss(){
  const w=$('#playWrap'), st=S.settings, r=curRound();

      <div class="infobox">جدول واحد للجميع، مباريات <b>لاعب ضد لاعب</b> — كل جولة يُزاوَج المتقاربون بالنقاط
        (الرابح مع رابح، الخاسر مع خاسر) <b>بلا إعادة لقاء</b>، ولا يُقصى أحد قبل نهاية الجولات.
        الحاضرون: <b>${P}</b> · الجولات المقترحة: <b>${sug||'—'}</b>.${P%2?' العدد فردي: الأدنى ترتيباً يستريح ويأخذ نقاط فوز (مرة واحدة لكل لاعب).':''}

      <button class="btn main" id="swDraw" ${P<2?'disabled':''}>🎲 تزاوج الجولة ${S.rounds.length+1}</button>
      ${undone?'<div class="warnbox" style="margin:8px 0 0">سجّل كل نتائج الجولة الحالية أولاً — التزاوج القادم يُبنى عليها.</div>':''}
      ${P<2?'<div class="warnbox" style="margin:8px 0 0">يلزم لاعبان حاضران على الأقل.</div>':''}
    </div>
    ${r?renderRound(r):'<div class="card"><div class="empty">لا جولات بعد.<br>اضغط «تزاوج الجولة 1» للبدء.</div></div>'}
    ${S.rounds.length>1?`<button class="btn ghost" id="hist" style="margin-bottom:8px">عرض الجولات السابقة (${S.rounds.length-1})</button>`:''}

  if($('#swDraw')) $('#swDraw').onclick=swissDraw;
  if($('#hist')) $('#hist').onclick=showHistory;
  if($('#archBtn')) $('#archBtn').onclick=showArchive;
  wireRound();
  if($('#redoR')) $('#redoR').onclick=()=>{   /* بالسويسري: إعادة التزاوج تعيد بناء آخر جولة */

function swissDraw(){
  const P=present();
  if(P.length<2){ alert('يلزم لاعبان حاضران على الأقل.'); return; }
  const r0=curRound();
  if(r0&&r0.matches.some(m=>!m.result)&&!confirm('توجد مباريات بلا نتيجة بالجولة الحالية — التزاوج يعتمد على النتائج. المتابعة؟')) return;
  const m=stats(), gm=goalsMap(true);
  /* من التقى بمن (كل الجولات) + من استراح */
  const met={}, byes=new Set();
  S.rounds.forEach(r=>{ if(r.bye) byes.add(r.bye);
    r.matches.forEach(mt=>{ const a=(mt.teams[0]||[])[0], b=(mt.teams[1]||[])[0]; if(!a||!b) return;
      (met[a]=met[a]||new Set()).add(b); (met[b]=met[b]||new Set()).add(a); }); });
  let pool=P.map(k=>({id:k.id, pts:(m[k.id]||{pts:0}).pts, g:gm[k.id]||0, no:k.no}))
    .sort((a,b)=>b.pts-a.pts||b.g-a.g||a.no-b.no);
  let bye=null;
  if(pool.length%2){    /* الاستراحة للأدنى ترتيباً ممن لم يسترح بعد */
    let bi=pool.length-1;
    for(let i=pool.length-1;i>=0;i--) if(!byes.has(pool[i].id)){ bi=i; break; }
    bye=pool.splice(bi,1)[0];
  }
  const pairs=[], used=new Array(pool.length).fill(false);
  for(let i=0;i<pool.length;i++){
    if(used[i]) continue; used[i]=true;
    let j=-1;
    for(let k2=i+1;k2<pool.length;k2++){ if(used[k2]) continue;
      if(!(met[pool[i].id]&&met[pool[i].id].has(pool[k2].id))){ j=k2; break; } }
    if(j<0) for(let k2=i+1;k2<pool.length;k2++){ if(!used[k2]){ j=k2; break; } }  /* اضطراري: إعادة لقاء */
    used[j]=true; pairs.push([pool[i].id,pool[j].id]);
  }
  S.rseq++;
  S.rounds.push({id:uid('r'),no:S.rseq,ts:nowISO(),teamSize:1,
    sitting:bye?[bye.id]:[], bye:bye?bye.id:null,
    matches:pairs.map((p,i)=>({id:uid('m'),no:i+1,teams:[[p[0]],[p[1]]],result:null,ts:nowISO()}))});
  save(); autoBackup('بعد تزاوج سويسري');
  renderPlay(); renderHeader();
  document.querySelector('main').scrollTop=0;
}

/* ===== قرعة نصف النهائي المصنّفة بالسلال ===== */
function semiPool(){
  const ts=Math.max(3,Math.min(6,Number(S.settings.teamSize)||5));
  const t=table().filter(x=>x.present);
  const need=4*ts, okP=t.filter(x=>x.ok), rest=t.filter(x=>!x.ok);
  if(t.length<need) return {err:'قرعة نصف النهائي تحتاج '+need+' لاعباً حاضراً على الأقل (الحاضرون الآن: '+t.length+').\nعلّم الحاضرين أو صغّر حجم الفريق.'};
  /* الأفضلية المطلقة للمتأهلين الحاضرين؛ إذا غاب متأهل يُكمَّل النقص من
     أوائل غير المتأهلين الحاضرين بالترتيب الرسمي — ويُعلَّمون 🟡 «مكمّل» */
  let starters, subs=0;
  if(okP.length>=need) starters=okP.slice(0,need);
  else {
    const fill=rest.slice(0,need-okP.length).map(x=>({...x,sub:true}));
    subs=fill.length;
    starters=okP.concat(fill);
  }
  const sIds=new Set(starters.map(x=>x.id));
  const bench=t.filter(x=>!sIds.has(x.id));
  const pots=[]; for(let i=0;i<ts;i++) pots.push(starters.slice(i*4,i*4+4));
  return {ts,pots,bench,subs};
}
function applySemi(teams4,benchT,ts){
  autoBackup('قبل اعتماد قرعة نصف النهائي',true);
  if(S.teams.length||S.fixtures.length) pushArchive('فرق وجدول سابق (قبل نصف النهائي)',S.teams,S.fixtures,[]);

  S.teams=teams4.map((tp,i)=>({id:uid('t'),no:i+1,name:'فريق '+NM[i],coach:'',group:null,
    kids:tp.map(x=>x.id).concat((benchT&&benchT[i]||[]).map(x=>x.id)),ts:nowISO()}));
  S.tseq=4; S.fixtures=[]; S.fseq=0;
  const ord=shuffle([0,1,2,3]);
  pushFx('S',null,S.teams[ord[0]].id,S.teams[ord[1]].id,false);
  pushFx('S',null,S.teams[ord[2]].id,S.teams[ord[3]].id,false);
  /* تشكيلة البداية بالفيش = الأساسيون المسحوبون من السلال تلقائياً */
  S.fixtures.forEach(fx=>{

    const luOf=tid=>{ const i=S.teams.findIndex(t=>t.id===tid); return teams4[i].map(x=>x.id).slice(0,ts); };
    f.lineup={a:luOf(fx.a),b:luOf(fx.b)};
  });
  save(); closeSheet(); renderPlay(); renderHeader();
  alert('✔ اعتُمدت فرق نصف النهائي الأربعة وتشكيلاتها الأساسية.\nبعد حسم النصفين اكبس «إنشاء النهائي والمركز الثالث».\nنتائج هذه المرحلة لا تدخل بالترتيب الفردي.');
}
function semiCeremony(quick){
  const P=semiPool(); if(P.err){ alert(P.err); return; }
  const NM=['الأزرق','الأحمر','الأخضر','الأصفر'];
  const teams=[[],[],[],[]];
  const pots=P.pots.map(p=>p.slice());
  let potIdx=0, last=null, printEach=!quick;
  let potTeams=shuffle([0,1,2,3]);   /* الفرق التي لم تأخذ بعد من السلة الحالية */
  const eAge=x=>effAgeOf(kid(x.id));   /* العمر الفعّال — البنت تُحسب أصغر */
  /* التوازن بالعمر لا بالنقاط: الأولاد لعبوا ضد بعضهم فالنقاط متقاربة،
     لكن ابن 11 أقوى بكثير من ابن 7 — العمر هو مقياس القوة الحقيقي.
     مكافأة الأوائل: فرق أصحاب المراكز 1، 2، 3 (بحسب من أخذ لاعب السلة الأولى)
     تُستهدف بأعمار أعلى بتدرّج ~0.75 / 0.5 / 0.25 سنة عن فريق الرابع. */
  const advOn=S.settings.semiAdv!==false;   /* خيار قابل للإطفاء من بطاقة القرعة */
  const ADV=advOn?[0.75,0.5,0.25,0]:[0,0,0,0];
  const teamAdv=tp=>{ const p0=tp[0]; if(!p0) return 0;
    const i=P.pots[0].findIndex(x=>x.id===p0.id); return i<0?0:ADV[i]; };
  /* الفروق تُقاس على (متوسط العمر − أفضلية الفريق): التساوي هنا يعني أن
     فريق الأول أكبر فعلياً بـ0.75 سنة من فريق الرابع — وهذا هو المقصود */
  const adjSpreadIf=(teamsArr,ti,x)=>{
    const avgs=teamsArr.map((tp,j)=>{
      const a=(j===ti)?tp.concat([x]):tp;
      if(!a.length) return null;
      return a.reduce((s,m)=>s+eAge(m),0)/a.length - teamAdv(a);
    }).filter(v=>v!=null);
    return Math.max(...avgs)-Math.min(...avgs);
  };
  const pickTeam=(cand,teamsArr,x)=>{
    let best=cand[0], bv=Infinity;
    cand.forEach(ti=>{
      const v=adjSpreadIf(teamsArr,ti,x);
      if(v<bv-1e-9){ bv=v; best=ti; }
    });
    return best;
  };
  let benchMemo=null;
  const benchAssign=()=>{
    if(benchMemo) return benchMemo;
    /* بدلاء: كل 4 متتالين بالترتيب يتوزّعون على الفرق الأربعة (عدالة مستوى)،
       واختيار الفريق داخل كل رباعية يوازن القوة والأعمار على مجموع التشكيلة */
    const t4=[[],[],[],[]];
    const cur=()=>teams.map((tp,i)=>tp.concat(t4[i]));
    for(let i=0;i<P.bench.length;i+=4){
      let rt=shuffle([0,1,2,3]);
      P.bench.slice(i,i+4).forEach(x=>{
        const ti=pickTeam(rt,cur(),x);
        rt=rt.filter(t=>t!==ti);
        t4[ti].push(x);
      });
    }
    benchMemo=t4; return t4;
  };
  const done=()=>potIdx>=pots.length;
  const drawOne=()=>{
    if(done()) return null;
    const pool=pots[potIdx];
    const x=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    const ti=pickTeam(potTeams,teams,x);
    potTeams=potTeams.filter(t=>t!==ti);
    teams[ti].push(x);
    const info={x,team:ti,pot:potIdx};
    if(!potTeams.length){ potTeams=shuffle([0,1,2,3]); potIdx++; }
    last=info; return info;
  };
  /* موازنة نهائية شفافة: تبديلات بين الفرق ضمن <b>نفس السلة فقط</b> ما دامت تقرّب
     الأعمار من هدفها (التساوي + الأفضلية المتدرّجة للأوائل) — تُعرض علناً واحداً واحداً. */
  const teamCost=()=>{
    const avgs=teams.map(tp=>tp.length?tp.reduce((a,x)=>a+eAge(x),0)/tp.length - teamAdv(tp):0);
    return Math.max(...avgs)-Math.min(...avgs);
  };
  let balSwaps=null;   /* null = لم تُنفَّذ الموازنة بعد */
  const polishTeams=()=>{
    const swaps=[];
    let improved=true;
    while(improved&&swaps.length<40){
      improved=false;
      for(let p=0;p<pots.length;p++)
        for(let a=0;a<4;a++) for(let b=a+1;b<4;b++){
          if(!teams[a][p]||!teams[b][p]) continue;
          const cur=teamCost();
          const x1=teams[a][p], x2=teams[b][p];
          teams[a][p]=x2; teams[b][p]=x1;
          if(teamCost()<cur-1e-9){
            swaps.push('سلة '+(p+1)+': '+x1.name+' ⇄ '+x2.name+' ('+NM[a]+' ↔ '+NM[b]+')');
            improved=true;
          } else { teams[a][p]=x1; teams[b][p]=x2; }
        }
    }
    benchMemo=null;   /* البدلاء يُعاد توزيعهم على التشكيلة المتوازنة */
    balSwaps=swaps;
    return swaps;
  };

/* ===== نمط «كبار وصغار ثم دمج» (semiMode='ages') =====
   نصف النهائي: الكبار ضد الكبار والصغار ضد الصغار — مباريات متكافئة عمرياً،
   والنهائي (والمركز الثالث): دمج الفائزين (والخاسرين) بالقرعة كباراً وصغاراً معاً.
   الأسماء تُنتقى من الأوائل (المتأهلين) لكن التوزيع داخل كل فئة عشوائي تماماً
   بمعيار واحد هو العمر — «أزواج العمر»: كل متقاربَيْن بالعمر يفترقان على الفريقين
   (المتعادلون بالعمر يُخلطون قبل الترتيب) — النقاط لا تدخل أبداً في التوزيع. */
function agesPool(){
  const base=semiPool(); if(base.err) return base;
  const ts=base.ts, starters=[]; base.pots.forEach(p=>starters.push(...p));
  const idx=x=>starters.indexOf(x);
  /* البنت دائماً ضمن الصغار مهما كان عمرها — تُدفع لذيل الترتيب العمري */
  const gKey=x=>{ const k=kid(x.id); return k.g==='g'?-100+effAgeOf(k):effAgeOf(k); };
  const byAge=starters.slice().sort((a,b)=>gKey(b)-gKey(a)||idx(a)-idx(b));
  const olders=byAge.slice(0,2*ts), youngers=byAge.slice(2*ts);
  const pairsOf=g=>{ const o=shuffle(g.slice()).sort((a,b)=>effAgeOf(kid(b.id))-effAgeOf(kid(a.id))), out=[];
    for(let i=0;i<o.length;i+=2) out.push(o.slice(i,i+2)); return out; };
  return {ts,subs:base.subs,bench:base.bench,olders,youngers,
    groups:[{label:'الكبار',pairs:pairsOf(olders),t:[0,1]},
            {label:'الصغار',pairs:pairsOf(youngers),t:[2,3]}]};
}
/* مراسم سحب عامة بالأزواج: الاسم الأول من كل زوج لفريق عشوائي والثاني للفريق الآخر */
function pairCeremony(cfg){
  const {TN,groups,quick,applyLabel,onApply,title}=cfg;
  const teams=[[],[],[],[]];
  let gi=0,pi=0,firstSide=null,last=null,printEach=!quick;

  const drawOne=()=>{
    if(done()) return null;
    const g=groups[gi], pool=g.pairs[pi];
    const x=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    let ti;
    if(firstSide===null){ ti=g.t[Math.floor(Math.random()*2)]; firstSide=ti; }
    else ti=(g.t[0]===firstSide?g.t[1]:g.t[0]);
    teams[ti].push(x);
    const info={x,team:ti,grp:g.label,pair:pi+1};
    if(!pool.length){ pi++; firstSide=null; if(pi>=g.pairs.length){ gi++; pi=0; } }
    last=info; return info;
  };
  const ticket=info=>doPrint(`<div class="pr">${head(title)}

  if(quick){ while(!done()) drawOne(); }
  const usedT=[...new Set(groups.reduce((a,g)=>a.concat(g.t),[]))];
  const render=()=>{
    const g=done()?null:groups[gi];
    sheet(`<h2>🏆 ${title}${quick?'':' — سحب علني'}</h2>
      ${done()?'<div class="okbox">✔ اكتملت القرعة — راجع الفرق ثم اعتمدها.</div>'
        :`<div class="infobox"><b>${esc(g.label)}</b> — الزوج <b>${pi+1}</b> من ${g.pairs.length}:
          ${g.pairs[pi].map(x=>esc(kid(x.id).name.split(' ')[0])+ageTxt(x.id)).join('، ')}
          <br>الاسم الأول لفريق بالصدفة، ورفيق زوجه للفريق الآخر</div>`}
      ${last?`<div style="text-align:center;margin:8px 0;padding:10px;border:2px solid var(--gold);border-radius:12px;background:var(--goldL)">
        <div class="mini">${esc(last.grp)} — الزوج ${last.pair}</div>
        <div style="font-size:22px;font-weight:800">${kid(last.x.id).no}. ${esc(kid(last.x.id).name)}${ageTxt(last.x.id)}</div>
        <div style="font-weight:800;color:var(--green)">⬅ ${esc(TN[last.team])}</div></div>`:''}
      <div class="row2">${usedT.map(i=>{
        const tp=teams[i], ags=tp.map(x=>kidAgeById(x.id)).filter(v=>v!=null);
        const avg=ags.length?(Math.round(ags.reduce((a,b)=>a+b,0)/ags.length*10)/10):null;

          <b>${esc(TN[i])}</b>${avg!=null?` <span class="mini">🎂 ${avg}</span>`:''}
          <ul style="list-style:none;margin-top:4px">${tp.map(x=>`<li style="font-size:13px;padding:1px 0">⭐ ${kid(x.id).no}. ${esc(kid(x.id).name)}${ageTxt(x.id)}${x.sub?' <span class="tag y">🟡 مكمّل</span>':''}</li>`).join('')}</ul>
        </div>`;}).join('')}</div>
      ${done()?'':`<label class="mini" style="display:block;margin:8px 0"><input type="checkbox" id="pcPr" ${printEach?'checked':''} style="width:auto;margin-left:6px">🖨 طباعة كل اسم فور سحبه (تذكرة)</label>
        <button class="btn gold" id="pcDraw">🎲 اسحب الاسم التالي</button>`}
      ${done()?`<button class="btn main" id="pcOK" style="margin-top:8px">✔ ${applyLabel}</button>`:''}

    if($('#pcPr')) $('#pcPr').onchange=e=>{ printEach=e.target.checked; };

  };

}
function agesCeremony(quick){
  const P=agesPool(); if(P.err){ alert(P.err); return; }
  const TN=['فريق الكبار الأزرق','فريق الكبار الأحمر','فريق الصغار الأخضر','فريق الصغار الأصفر'];
  pairCeremony({title:'قرعة نصف النهائي — كبار وصغار',TN,quick,
    groups:P.groups.map(g=>({label:g.label,t:g.t,pairs:g.pairs.map(p=>p.slice())})),
    applyLabel:'اعتماد الفرق وإنشاء نصفي النهائي',
    onApply:teams=>{
      autoBackup('قبل اعتماد قرعة نصف النهائي (كبار/صغار)',true);
      if(S.teams.length||S.fixtures.length) pushArchive('فرق وجدول سابق (قبل نصف النهائي)',S.teams,S.fixtures,[]);
      /* البدلاء: من عمره أقرب للكبار مع فريقَي الكبار بالتناوب، والباقي مع الصغار */
      const bt=[[],[],[],[]];
      if(P.bench.length){
        const oMin=Math.min.apply(null,P.olders.map(x=>effAgeOf(kid(x.id))));
        const yMax=P.youngers.length?Math.max.apply(null,P.youngers.map(x=>effAgeOf(kid(x.id)))):oMin;
        const mid=(oMin+yMax)/2; let o=0,y=0;
        /* بنات البدلاء أيضاً مع الصغار دائماً */
        P.bench.forEach(x=>{ if(kid(x.id).g!=='g'&&effAgeOf(kid(x.id))>=mid) bt[(o++)%2].push(x); else bt[2+(y++)%2].push(x); });
      }
      S.teams=teams.map((tp,i)=>({id:uid('t'),no:i+1,name:TN[i],coach:'',group:null,
        kids:tp.map(x=>x.id).concat(bt[i].map(x=>x.id)),ts:nowISO()}));
      S.tseq=4; S.fixtures=[]; S.fseq=0;
      pushFx('S',null,S.teams[0].id,S.teams[1].id,false); S.fixtures[0].am=1;
      pushFx('S',null,S.teams[2].id,S.teams[3].id,false); S.fixtures[1].am=1;
      S.fixtures.forEach((fx,i)=>{ const f=ficheOf(fx);
        f.lineup={a:teams[i*2].map(x=>x.id),b:teams[i*2+1].map(x=>x.id)}; });
      save(); closeSheet(); renderPlay(); renderHeader();
      alert('✔ اعتُمد نصفا النهائي:\nالكبار ضد الكبار، والصغار ضد الصغار.\nبعد حسم المباراتين اكبس «دمج الفائزين — قرعة النهائي'+(S.settings.thirdPlace!==false?' والمركز الثالث':'')+'».\nنتائج المرحلة لا تدخل بالترتيب الفردي.');
    }});
}
/* القلب المشترك لقرعة الدمج (أول مرة أو إعادة): أزواج بالعمر + خيار فصل الأقوى اثنين */
function buildMergeCeremony(cfg){
  const {win,lose,wb,lb,quick,archLabel}=cfg;
  const third=S.settings.thirdPlace!==false;
  const pairsByAge=arr=>{ const o=arr.slice().sort((a,b)=>effAgeOf(kid(b.id))-effAgeOf(kid(a.id))), out=[];
    for(let i=0;i<o.length;i+=2) out.push(o.slice(i,i+2)); return out; };
  const TN=['فريق النهائي الأزرق','فريق النهائي الأحمر','فريق المركز الثالث الأخضر','فريق المركز الثالث الأصفر'];
  /* خيار «فصل الأقوى اثنين»: أفضل فائزَيْن بالترتيب الرسمي يشكلان أول زوج فيفترقان حكماً */
  let pairsW=null;
  if(S.settings.fnSplit===true && win.length>=4){
    const ord=table(), ri=id=>{ const i=ord.findIndex(x=>x.id===id); return i<0?9999:i; };
    const sorted=win.slice().sort((a,b)=>ri(a.id)-ri(b.id));
    const t2=[sorted[0],sorted[1]];
    pairsW=[[t2[0],t2[1]]].concat(pairsByAge(win.filter(x=>x!==t2[0]&&x!==t2[1])));
  } else pairsW=pairsByAge(win);
  const groups=[];
  if(third) groups.push({label:'المركز الثالث — خاسرا النصفين مدموجين',t:[2,3],pairs:pairsByAge(lose)});
  groups.push({label:'النهائي — فائزا النصفين مدموجين'+(S.settings.fnSplit===true?' — أول زوج: الأقوى اثنان يفترقان ⭐':''),t:[0,1],pairs:pairsW});
  pairCeremony({title:'قرعة الدمج — النهائي'+(third?' والمركز الثالث':''),TN,quick,groups,
    applyLabel:'اعتماد الفرق وإنشاء النهائي'+(third?' والمركز الثالث':''),
    onApply:teams=>{
      autoBackup('قبل اعتماد قرعة الدمج',true);
      pushArchive(archLabel,S.teams,S.fixtures,[]);
      const alt=(arr,i0,i1)=>{ const o=arr.slice().sort((a,b)=>effAgeOf(kid(b.id))-effAgeOf(kid(a.id)));
        const t={}; t[i0]=[]; t[i1]=[]; o.forEach((x,i)=>t[i%2?i1:i0].push(x)); return t; };
      const wbt=alt(wb,0,1), lbt=third?alt(lb,2,3):null;
      const mk=(i,bench)=>({id:uid('t'),no:i+1,name:TN[i],coach:'',group:null,
        kids:teams[i].map(x=>x.id).concat((bench||[]).map(x=>x.id)),ts:nowISO()});
      S.teams=[mk(0,wbt[0]),mk(1,wbt[1])];
      if(third) S.teams.push(mk(2,lbt[2]),mk(3,lbt[3]));
      S.tseq=S.teams.length; S.fixtures=[]; S.fseq=0;
      if(third) pushFx('T',null,S.teams[2].id,S.teams[3].id,false);
      pushFx('F',null,S.teams[0].id,S.teams[1].id,false);
      S.fixtures.forEach(fx=>{ const f=ficheOf(fx);
        const iA=S.teams.findIndex(t=>t.id===fx.a), iB=S.teams.findIndex(t=>t.id===fx.b);
        f.lineup={a:teams[iA].map(x=>x.id),b:teams[iB].map(x=>x.id)}; });
      save(); closeSheet(); renderPlay(); renderHeader();
      alert('✔ اعتُمدت فرق '+(third?'النهائي والمركز الثالث':'النهائي')+' — كبار وصغار مدموجين بالقرعة.\nالمرحلة السابقة محفوظة بالأرشيف 📚.');
    }});
}
/* دمج الفائزين (والخاسرين) بالقرعة: أزواج بالعمر — كل متقاربَيْن عمراً يفترقان */
function mergeCeremony(quick){
  const semis=S.fixtures.filter(f=>f.stage==='S'&&f.am);
  if(semis.length<2||semis.some(f=>!fxWinner(f))){ alert('احسم نصفي النهائي أولاً — عند التعادل اختر الفائز بركلات الترجيح.'); return; }
  if(S.fixtures.some(f=>f.stage==='F')) return;
  const ts=Math.max(3,Math.min(6,Number(S.settings.teamSize)||5));
  const stOf=t=>team(t).kids.slice(0,ts).map(id=>({id})), bnOf=t=>team(t).kids.slice(ts).map(id=>({id}));
  const win=[],lose=[],wb=[],lb=[];
  semis.forEach(f=>{ const w=fxWinner(f), l=(w===f.a?f.b:f.a);
    win.push.apply(win,stOf(w)); wb.push.apply(wb,bnOf(w));
    lose.push.apply(lose,stOf(l)); lb.push.apply(lb,bnOf(l)); });
  buildMergeCeremony({win,lose,wb,lb,quick,archLabel:'نصف النهائي كبار/صغار (نتائجه محفوظة)'});
}
/* إعادة قرعة الدمج بعد الاعتماد — لغياب طارئ قبل النهائي:
   الغائب يُستثنى ويكمّل مكانه التالي الحاضر من كتيبة فريقه بنصف النهائي
   (بترتيب الفريق: الأساسيون ثم البدلاء)، وتُعاد القرعة كاملة أمام الجميع.
   المصدر: نسخة نصف النهائي المحفوظة بالأرشيف — فلا تتأثر بحذف البدلاء من فرق النهائي. */
function redoMergeCeremony(quick){
  if(S.fixtures.some(f=>(f.stage==='F'||f.stage==='T')&&f.ga!=null)){
    alert('توجد نتيجة مسجّلة بالنهائي/المركز الثالث — لا إعادة قرعة بعد تسجيل النتائج.\nإن كانت النتيجة خطأ احذفها أولاً.');
    return;
  }
  const arc=(S.archive||[]).slice().reverse().find(a=>String(a.label).includes('نصف النهائي كبار/صغار'));
  if(!arc||!(arc.fixtures||[]).length){ alert('لا توجد نسخة نصف النهائي بالأرشيف — لا يمكن إعادة القرعة.'); return; }
  const semis=(arc.fixtures||[]).filter(f=>f.stage==='S');
  const aTeam=id=>(arc.teams||[]).find(t=>t.id===id);
  const winOf=f=>{ if(f.ga==null||f.gb==null) return null;
    if(f.ga>f.gb) return f.a; if(f.gb>f.ga) return f.b;
    return f.pens==='A'?f.a:(f.pens==='B'?f.b:null); };
  if(semis.length<2||semis.some(f=>!winOf(f))){ alert('نسخة نصف النهائي بالأرشيف غير مكتملة.'); return; }
  const ts=Math.max(3,Math.min(6,Number(S.settings.teamSize)||5));
  const isPres=id=>{ const k=S.kids.find(x=>x.id===id); return !!(k&&k.present); };
  const win=[],lose=[],wb=[],lb=[],out=[];
  let short=false;
  semis.forEach(f=>{
    const w=winOf(f), l=(w===f.a?f.b:f.a);
    [[w,win,wb],[l,lose,lb]].forEach(pair=>{
      const t=aTeam(pair[0]); if(!t){ short=true; return; }
      t.kids.slice(0,ts).forEach(id=>{ if(!isPres(id)) out.push(id); });
      const pres=t.kids.filter(isPres);
      if(pres.length<ts) short=true;
      pres.slice(0,ts).forEach(id=>pair[1].push({id}));
      pres.slice(ts).forEach(id=>pair[2].push({id}));
    });
  });
  if(short){ alert('الحاضرون من كتائب نصف النهائي لا يكفون ('+ts+' لكل فريق).\nعلّم الحضور من تبويب اللاعبين أولاً.'); return; }
  if(!confirm('إعادة قرعة الدمج كاملة؟\n'+(out.length?('الغائبون المستبدلون بالتالي الحاضر من كتيبة فريقهم:\n'+out.map(id=>kid(id).name).join('، ')+'\n'):'لا غائبين حالياً — ستُعاد القرعة بنفس اللاعبين.\n')+'الفرق الحالية تُحفظ بالأرشيف 📚.')) return;
  buildMergeCeremony({win,lose,wb,lb,quick,archLabel:'قرعة دمج سابقة (أُعيدت لغياب طارئ)'});
}
function makePlayoff(){
  const st=S.settings, q=table().filter(x=>x.ok);
  const n=Math.min(Number(st.teamSize)||4, Math.floor(q.length/4));
  if(n<2){ alert('مرحلة النهائي تحتاج 8 متأهلين على الأقل.'); return; }

  autoBackup('قبل مرحلة النهائي',true);
  const top=q.slice(0,4*n), buckets=[[],[],[],[]];
  top.forEach((x,i)=>{ const row=Math.floor(i/4), pos=i%4; buckets[row%2===0?pos:3-pos].push(x.id); });
  const NM=['أ','ب','ج','د'];
  S.teams=buckets.map((ks,i)=>({id:uid('t'),no:i+1,name:'فريق '+NM[i],group:null,kids:ks,ts:nowISO()}));

  pushFx('S',null,S.teams[0].id,S.teams[3].id,false);
  pushFx('S',null,S.teams[1].id,S.teams[2].id,false);
  save(); renderPlay();
}

/* موازنة مجموع الأعمار بين كل فريقين متقابلين:
   تبديل لاعبين من نفس الفئة فقط (لا يكسر توزيع الفئات) ما دام يقرّب مجموعي العمر */
/* تقسيم كتلة مباراة واحدة إلى فريقين:
   البنات تتوزّعن واحدة مقابل واحدة على الجهتين، والصبيان بالتوازن الأقرب لمجموع الأعمار */
function splitBlock(blk,ts){
  const girls=blk.filter(k=>k.g==='g').sort((a,b)=>effAgeOf(b)-effAgeOf(a));
  const boys=blk.filter(k=>k.g!=='g').sort((a,b)=>effAgeOf(b)-effAgeOf(a));
  const t=[[],[]], s=[0,0], st0=Math.random()<0.5?0:1;
  girls.forEach((k,i)=>{ const j=(i+st0)%2; t[j].push(k.id); s[j]+=effAgeOf(k); });
  boys.forEach(k=>{
    let j;
    if(t[0].length>=ts) j=1;
    else if(t[1].length>=ts) j=0;
    else j=s[0]<=s[1]?0:1;
    t[j].push(k.id); s[j]+=effAgeOf(k);
  });
  return t;
}
function balanceMatchAges(teams){
  const yrOf=id=>effAgeOf(kid(id));   /* العمر الفعّال — البنت الكبيرة تُحسب كعمر 9 */
  const sum=t=>t.reduce((a,id)=>a+yrOf(id),0);
  for(let m=0;m+1<teams.length;m+=2){
    const A=teams[m], B=teams[m+1];
    let improved=true, guard=0;
    while(improved&&guard++<60){
      improved=false;
      const d=Math.abs(sum(A)-sum(B));
      if(d<=1) break;
      for(let i=0;i<A.length&&!improved;i++) for(let j=0;j<B.length&&!improved;j++){
        const ka=S.kids.find(k=>k.id===A[i]), kb=S.kids.find(k=>k.id===B[j]);
        if(!ka||!kb||pot(ka)!==pot(kb)||(ka.g==='g')!==(kb.g==='g')) continue; /* لا نكسر توزيع البنات */
        const t=A[i]; A[i]=B[j]; B[j]=t;
        if(Math.abs(sum(A)-sum(B))<d) improved=true;
        else { const t2=A[i]; A[i]=B[j]; B[j]=t2; }
      }
    }
  }
}

/* منع تكرار الفريق نفسه حرفياً بين الجولات: نفس المجموعة تماماً لا تجتمع مرتين */
function prevTeamKeys(){
  const ks=new Set();
  const add=t=>{ if(t&&t.length>1) ks.add(t.slice().sort().join('|')); };
  S.rounds.forEach(r=>r.matches.forEach(m=>(m.teams||[]).forEach(add)));
  (S.archive||[]).forEach(a=>(a.rounds||[]).forEach(r=>(r.matches||[]).forEach(m=>(m.teams||[]).forEach(add))));
  return ks;
}
function avoidRepeatTeams(teams){
  const prev=prevTeamKeys(); if(!prev.size) return;
  const key=t=>t.slice().sort().join('|');
  const tryPairs=(A,B,cond)=>{
    for(let i=0;i<A.length;i++) for(let j=0;j<B.length;j++){
      const ka=kid(A[i]), kb=kid(B[j]);
      if(!ka||!kb) continue;
      if((ka.g==='g')!==(kb.g==='g')) continue;      /* لا نكسر توزيع البنات */
      if(!cond(ka,kb)) continue;
      const t=A[i]; A[i]=B[j]; B[j]=t;
      if(!prev.has(key(A))&&!prev.has(key(B))) return true;
      const t2=A[i]; A[i]=B[j]; B[j]=t2;
    }
    return false;
  };
  for(let m=0;m+1<teams.length;m+=2){
    const A=teams[m], B=teams[m+1];
    if(!prev.has(key(A))&&!prev.has(key(B))) continue;
    /* مبادلة زوج من نفس الفئة (تحفظ التوازن)، وإلا الأقرب عمراً */
    if(tryPairs(A,B,(a,b)=>pot(a)===pot(b))) continue;
    tryPairs(A,B,(a,b)=>Math.abs(effAgeOf(a)-effAgeOf(b))<=1);
  }
}

/* قرعة مباراة واحدة داخل الجولة — تستثني المنتقين في باقي مباريات الجولة */
function drawOneMatch(r,excludeMatchId){
  const ts=r.teamSize, st=S.settings;
  const inRound=new Set();
  r.matches.forEach(m=>{ if(m.id!==excludeMatchId) m.teams.forEach(t=>t.forEach(id=>inRound.add(id))); });
  const P=present().filter(k=>!inRound.has(k.id));
  if(P.length<ts*2) return null;
  const pl=playedMap(), minQ=Number(st.minMatches)||0, nowY=new Date().getFullYear();
  const isMid=k=>{ const y=Number(k.year)||0; if(!y) return false; const a=nowY-y; return a>=7&&a<=9; };
  /* أولوية المكمّلين للمتأخرين بالترتيب (خيار): بين من بلغ الحد، الأدنى معدّلاً أولاً */
  const stm=st.lowRank?stats():null;
  const rk=k=>{ const s=stm&&stm[k.id]; return (s&&s.played)?(s.pts/s.played):0; };
  const pool=shuffle(P).sort((a,b)=>{
    const na=(pl[a.id]||0)>=minQ?1:0, nb=(pl[b.id]||0)>=minQ?1:0;
    if(na!==nb) return na-nb;
    if(na===0) return (pl[a.id]||0)-(pl[b.id]||0);
    if(stm){ const ra=rk(a), rb=rk(b); if(ra!==rb) return ra-rb; }
    if(isMid(a)!==isMid(b)) return isMid(a)?-1:1;
    return (pl[a.id]||0)-(pl[b.id]||0);
  });
  const playing=pool.slice(0,ts*2);
  if(st.balance){
    /* كتلة واحدة: بنت مقابل بنت حيث أمكن + توازن مجموع الأعمار */
    const teams=splitBlock(playing,ts);
    balanceMatchAges(teams);
    avoidRepeatTeams(teams);
    return teams;
  }
  const ordered=shuffle(playing);
  const teams=[[],[]];
  ordered.forEach((k,i)=>{ const row=Math.floor(i/2), pos=i%2; teams[row%2===0?pos:1-pos].push(k.id); });
  avoidRepeatTeams(teams);
  return teams;
}
/* تبديل لاعب واحد داخل مباراة مقروعة — يخرج ويدخل بديل مكانه دون المسّ بباقي المجموعة */
function swapPlayerSheet(r,m){
  if(m.result){ alert('هذه المباراة سُجّلت نتيجتها.\nألغِ النتيجة أولاً (اضغط زر النتيجة المضاء نفسه) ثم بدّل اللاعب.'); return; }
  const pl=playedMap(), minQ=Number(S.settings.minMatches)||0;
  let selOut=null;
  const doSwap=(outId,inId)=>{
    const hasData=!!(m.fiche&&m.fiche.ev&&m.fiche.ev.length);
    const fn=()=>{
      autoBackup('قبل تبديل لاعب في مباراة '+m.no+' من الجولة '+r.no,true);
      m.teams=m.teams.map(t=>{
        const i=t.indexOf(outId); if(i<0) return t;
        const nt=t.slice(); if(inId) nt[i]=inId; else nt.splice(i,1); return nt;
      });
      m.ts=nowISO();
      recomputeSitting(r); save(); closeSheet(); renderPlay(); renderHeader();
      alert(inId?('✔ خرج '+kid(outId).name+' ودخل '+kid(inId).name+' مكانه.')
                :('✔ شُطب '+kid(outId).name+' من المباراة — فريقه يلعب ناقصاً.'));
    };
    const dp=String(S.settings.delPin||'');
    if(hasData&&dp) askCode({title:'تبديل لاعب', sub:'المباراة فيها أحداث فيش مسجّلة — أدخل رمز الحذف', pin:dp, onOK:fn});
    else if(hasData&&hasPin()) askCode({title:'تبديل لاعب', sub:'أدخل رمز الإعدادات للتأكيد', pin:S.settings.pin, recovery:true, onOK:fn});
    else fn();
  };
  const draw=()=>{
    const inR=new Set(); r.matches.forEach(x=>x.teams.forEach(t=>t.forEach(id=>inR.add(id))));
    const cands=present().filter(k=>!inR.has(k.id));
    const outK=selOut?S.kids.find(k=>k.id===selOut):null;
    /* ترتيب البدلاء: من لم يبلغ حد التأهل الأقل لعباً أولاً، ثم الأقرب عمراً (فعّالاً) للخارج */
    const sorted=outK?cands.slice().sort((a,b)=>{
      const na=(pl[a.id]||0)>=minQ?1:0, nb=(pl[b.id]||0)>=minQ?1:0;
      if(na!==nb) return na-nb;
      const da=Math.abs(effAgeOf(a)-effAgeOf(outK)), db=Math.abs(effAgeOf(b)-effAgeOf(outK));
      if(da!==db) return da-db;
      return (pl[a.id]||0)-(pl[b.id]||0);
    }):cands;
    const chip=id=>`<button data-so="${id}" class="${selOut===id?'on':''}">${kid(id).no}. ${esc(kid(id).name)}${ageTxt(id)}</button>`;
    sheet(`<h2>↔ تبديل لاعب — مباراة ${m.no}</h2>
      <div class="mini" style="margin-bottom:4px">١) اختر اللاعب الذي سيخرج من المباراة:</div>
      <div class="mini"><b>الفريق الأول</b></div><div class="chips">${m.teams[0].map(chip).join('')}</div>
      <div class="mini"><b>الفريق الثاني</b></div><div class="chips">${m.teams[1].map(chip).join('')}</div>
      ${selOut?`<div class="mini" style="margin:10px 0 4px">٢) اختر البديل — الأولوية لمن لم يبلغ حد التأهل ثم الأقرب عمراً:</div>
        ${sorted.length?`<div class="chips">${sorted.map(k=>`<button data-si="${k.id}">${k.no}. ${esc(k.name)}${ageTxt(k.id)} <span class="mini">· لعب ${pl[k.id]||0}</span></button>`).join('')}</div>`
          :'<div class="empty">لا حاضرين متاحين خارج مباريات هذه الجولة — علّم متأخراً حاضراً من تبويب اللاعبين</div>'}
        <button class="btn ghost sm" id="swRm" style="width:100%;margin-top:8px;color:var(--red);border-color:#F3B7BF">شطبه بلا بديل (يلعب فريقه ناقصاً)</button>`:''}
      <button class="btn ghost" onclick="closeSheet()" style="margin-top:10px">إغلاق</button>`);
    document.querySelectorAll('#sheet [data-so]').forEach(b=>b.onclick=()=>{ selOut=b.dataset.so; draw(); });
    document.querySelectorAll('#sheet [data-si]').forEach(b=>b.onclick=()=>doSwap(selOut,b.dataset.si));
    if($('#swRm')) $('#swRm').onclick=()=>{
      if(!confirm('شطب '+kid(selOut).name+' من المباراة بلا بديل؟\nسيلعب فريقه ناقصاً بلاعب.')) return;
      doSwap(selOut,null);
    };
  };
  draw();
}
function recomputeSitting(r){
  const inR=new Set();
  r.matches.forEach(m=>m.teams.forEach(t=>t.forEach(id=>inR.add(id))));
  r.sitting=present().filter(k=>!inR.has(k.id)).map(k=>k.id);
}
function archiveMatch(r,m,label){

/* القرعة الموزونة */
function doDraw(ts,nm){
  const st=S.settings;
  const P=present();
  const need=ts*2*nm;
  if(!nm||P.length<need){ alert('عدد الحاضرين لا يكفي.'); return; }
  const pl=playedMap();
  const minQ=Number(st.minMatches)||0;
  /* الأولوية: ١) من لم يبلغ حد التأهل — الأقل لعباً أولاً.
     ٢) «المكمّلون» (بلغوا الحد): يُفضَّل عمر 7–9 سنوات (يتحملون مباريات إضافية)، ثم الأقل لعباً. */
  const nowY=new Date().getFullYear();
  const isMid=k=>{ const y=Number(k.year)||0; if(!y) return false; const a=nowY-y; return a>=7&&a<=9; };
  /* أولوية المكمّلين للمتأخرين بالترتيب (خيار): بين من بلغ الحد، الأدنى معدّلاً أولاً */
  const stm=st.lowRank?stats():null;
  const rk=k=>{ const s=stm&&stm[k.id]; return (s&&s.played)?(s.pts/s.played):0; };
  const pool=shuffle(P).sort((a,b)=>{
    const na=(pl[a.id]||0)>=minQ?1:0, nb=(pl[b.id]||0)>=minQ?1:0;
    if(na!==nb) return na-nb;
    if(na===0) return (pl[a.id]||0)-(pl[b.id]||0);
    if(stm){ const ra=rk(a), rb=rk(b); if(ra!==rb) return ra-rb; }
    if(isMid(a)!==isMid(b)) return isMid(a)?-1:1;
    return (pl[a.id]||0)-(pl[b.id]||0);
  });
  const playing=pool.slice(0,need);
  const sitting=pool.slice(need).map(k=>k.id);

  const T=nm*2;
  const teams=Array.from({length:T},()=>[]);
  if(st.balance){
    /* غروبات الأعمار: الصبيان بالعمر تنازلياً ثم البنات كلهنّ في آخر الترتيب —
       فتقع البنات في كتلة الأصغر سناً (مع أبناء الـ4-5 عند وجودهم)،
       وكل مباراة كتلة أعمار متجاورة — لا يجتمع ابن 4 سنوات مع أبناء 10-11 */
    const isG=k=>k.g==='g';
    const ordered=shuffle(playing).sort((a,b)=>((isG(a)?1:0)-(isG(b)?1:0))||(effAgeOf(b)-effAgeOf(a)));
    const blkSz=ts*2;
    for(let bi=0;bi<nm;bi++){
      const pair=splitBlock(ordered.slice(bi*blkSz,(bi+1)*blkSz),ts);   /* بنت مقابل بنت حيث أمكن */
      teams[bi*2]=pair[0]; teams[bi*2+1]=pair[1];
    }
    balanceMatchAges(teams);   // تقريب مجموع الأعمار بين المتقابلين داخل كل مباراة
  } else {
    const ordered=shuffle(playing);
    // توزيع «ثعباني» يضمن تساوي أحجام الفرق
    ordered.forEach((k,i)=>{
      const row=Math.floor(i/T), pos=i%T;
      teams[row%2===0?pos:T-1-pos].push(k.id);
    });
  }
  avoidRepeatTeams(teams);   // نفس الفريق حرفياً لا يتكرر بين الجولات

  S.rseq++;
  const r={id:uid('r'),no:S.rseq,ts:nowISO(),teamSize:ts,sitting,
    matches:Array.from({length:nm},(_,i)=>({id:uid('m'),no:i+1,teams:[teams[i*2],teams[i*2+1]],result:null}))};
  S.rounds.push(r); save(); autoBackup('بعد قرعة الجولة '+r.no);
  renderPlay(); renderHeader();
  document.querySelector('main').scrollTop=0;
}
